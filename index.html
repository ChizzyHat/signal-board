<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Board</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0A0E17 0%, #111827 50%, #0D1321 100%);
      color: #F1F1F1;
      font-family: 'DM Sans', sans-serif;
      padding: 24px 28px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* ── Header ── */
    .header { margin-bottom: 28px; }
    .header-top { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; }
    .header-left { display: flex; align-items: baseline; gap: 12px; }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: inline;
    }

    .header .count {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }

    /* ── Sync Status Indicator ── */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      transition: all 0.2s;
    }

    .sync-status:hover {
      border-color: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Settings Panel ── */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .settings-panel {
      background: #1A1F2E;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-panel h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .settings-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .settings-section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .settings-section h3 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
      color: #F1F1F1;
    }

    .settings-panel label {
      display: block;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .settings-panel label:first-of-type { margin-top: 0; }

    .settings-panel input[type="text"],
    .settings-panel input[type="password"],
    .settings-panel input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #F1F1F1;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }

    .settings-panel input:focus { border-color: rgba(255,255,255,0.3); }

    .settings-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-top: 4px;
      line-height: 1.5;
    }

    .settings-hint a { color: #3B82F6; text-decoration: none; }
    .settings-hint a:hover { text-decoration: underline; }

    .settings-buttons {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    /* Threshold row: status label + dot + days input */
    .threshold-row {
      display: grid;
      grid-template-columns: 16px 1fr 72px auto;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }

    .threshold-row .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .threshold-row .label {
      font-size: 13px;
      color: #F1F1F1;
    }

    .threshold-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      text-align: right;
      font-size: 12px;
    }

    .threshold-row .unit {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
    }

    .btn-primary {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      background: #3B82F6;
      color: #FFF;
      font-size: 12px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
    }

    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .settings-error {
      color: #EF4444;
      font-size: 12px;
      margin-top: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Filter Pills (status + solutions) ── */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .filter-pill {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Solution Tag Badges ── */
    .solution-tags { display: flex; gap: 4px; flex-wrap: wrap; }

    .sol-tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid;
      user-select: none;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .sort-btns { display: flex; gap: 4px; }

    .sort-btn {
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
    }

    .sort-btn.active {
      background: rgba(255,255,255,0.1);
      color: #F1F1F1;
    }

    .action-btns { display: flex; gap: 8px; }

    .btn-reset {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
    }

    .btn-add {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #F1F1F1;
      font-size: 12px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    /* ── Stagnant Queue Section ──
       Lives at the top of the board when any account exceeds its threshold. */
    .stagnant-section {
      margin-bottom: 20px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(245,158,11,0.06) 0%, rgba(245,158,11,0.02) 100%);
      overflow: hidden;
    }

    .stagnant-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .stagnant-header:hover {
      background: rgba(245, 158, 11, 0.05);
    }

    .stagnant-header .title {
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F59E0B;
    }

    .stagnant-header .count-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(245, 158, 11, 0.8);
      background: rgba(245, 158, 11, 0.12);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .stagnant-header .caret {
      margin-left: auto;
      font-size: 11px;
      color: rgba(245, 158, 11, 0.6);
      transition: transform 0.2s;
      font-family: 'JetBrains Mono', monospace;
    }

    .stagnant-header.collapsed .caret {
      transform: rotate(-90deg);
    }

    .stagnant-body {
      padding: 0 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stagnant-body.collapsed {
      display: none;
    }

    /* Small "stagnant Xd" badge shown inside each stagnant row */
    .stagnant-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* ── Column Headers ── */
    .col-headers {
      display: grid;
      /* rank | logo | name | solutions | stage | lights | note(+nextAction) | details | delete */
      grid-template-columns: 40px 32px 160px 70px 100px auto 1fr 28px 36px;
      gap: 12px;
      padding: 0 16px 8px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Account Rows ── */
    .accounts { display: flex; flex-direction: column; gap: 4px; }

    .account-row {
      display: grid;
      /* Must match .col-headers grid-template-columns above */
      grid-template-columns: 40px 32px 160px 70px 100px auto 1fr 28px 36px;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border-left: 4px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
    }

    /* ── Logo Thumbnail ── */
    .logo-wrap {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-placeholder {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      font-family: 'JetBrains Mono', monospace;
    }

    .logo-wrap:hover .logo-placeholder { color: rgba(255,255,255,0.5); }

    .logo-file-input { display: none; }

    .account-name {
      color: #F1F1F1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .name-input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: #F1F1F1;
      padding: 4px 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 100%;
    }

    .lights { display: flex; gap: 6px; align-items: center; }

    /* ── Priority Rank Badge ── */
    .rank-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      width: 36px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.55);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .rank-badge.empty { color: rgba(255,255,255,0.2); }

    .rank-badge:hover {
      border-color: rgba(255,255,255,0.25);
      color: #F1F1F1;
      background: rgba(255,255,255,0.08);
    }

    .rank-input {
      width: 36px;
      height: 24px;
      padding: 0 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      color: #F1F1F1;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }
    .rank-input::-webkit-outer-spin-button,
    .rank-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ── Sales Stage Dropdown ── */
    .stage-select {
      width: 100%;
      height: 26px;
      padding: 0 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      cursor: pointer;
      border-left-width: 3px;
    }

    .stage-select:hover { border-color: rgba(255,255,255,0.25); }
    .stage-select:focus { border-color: rgba(255,255,255,0.4); }
    .stage-select option { background: #1A1F2E; color: #F1F1F1; }

    .light {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }

    /* ── Note cell ──
       Wrapper allowing optional nextAction line above the inline note input. */
    .note-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .next-action-line {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.55);
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-action-line.overdue {
      color: #F87171; /* muted red */
    }

    .note-input {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: rgba(255,255,255,0.6);
      padding: 4px 8px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .note-input:hover { border-color: rgba(255,255,255,0.08); }
    .note-input:focus { border-color: rgba(255,255,255,0.15); }

    /* ── Details (›) button ── */
    .details-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 16px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      padding: 0;
      font-family: 'JetBrains Mono', monospace;
    }

    .details-btn:hover {
      color: #F1F1F1;
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: #EF4444; }

    .empty {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.25);
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Legend ── */
    .legend {
      margin-top: 32px;
      padding: 16px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-family: 'JetBrains Mono', monospace;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Logo Popup ── */
    .logo-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .logo-popup-inner {
      background: #1A1F2E;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
    }

    .logo-popup-inner h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .logo-popup-inner input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #F1F1F1;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      margin-bottom: 8px;
    }

    .logo-popup-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      min-height: 40px;
    }

    .logo-popup-preview img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      object-fit: contain;
    }

    .logo-popup-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    /* ── Filter separator ── */
    .filter-sep {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.1);
      margin: 0 4px;
      align-self: center;
    }

    /* ── Side Panel (Account Detail) ──
       Slides in from the right when the user clicks the › button on a row. */
    .side-panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      backdrop-filter: blur(2px);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .side-panel-backdrop.open { opacity: 1; }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 90%;
      max-width: 460px;
      background: #131826;
      border-left: 1px solid rgba(255,255,255,0.08);
      z-index: 91;
      padding: 24px 28px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .side-panel.open { transform: translateX(0); }

    .side-panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .side-panel-header .logo-mini {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .side-panel-header .logo-mini img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .side-panel-header h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-panel-close {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      font-family: 'JetBrains Mono', monospace;
    }

    .side-panel-close:hover {
      color: #F1F1F1;
      border-color: rgba(255,255,255,0.25);
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-section .panel-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Next action row: date + label side by side */
    .next-action-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px;
    }

    .panel-input,
    .panel-textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #F1F1F1;
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
    }

    .panel-input { font-family: 'JetBrains Mono', monospace; }

    .panel-input:focus,
    .panel-textarea:focus { border-color: rgba(255,255,255,0.3); }

    .panel-textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Read-only timestamps grid (last status / stage / touched) */
    .timestamps {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .timestamps .ts {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .timestamps .ts-label {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .timestamps .ts-value {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #F1F1F1;
    }

    .timestamps .ts-value.muted {
      color: rgba(255,255,255,0.3);
    }

    .next-action-clear {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      align-self: flex-start;
      padding: 0;
      text-decoration: underline;
    }

    .next-action-clear:hover { color: #EF4444; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body { padding: 16px; }
      .col-headers { display: none; }
      .account-row {
        grid-template-columns: 40px 32px 1fr 28px;
        gap: 8px;
        padding: 14px 16px;
      }
      .stage-select { grid-column: 1 / -1; }
      .lights { grid-column: 1 / -1; }
      .solution-tags { grid-column: 1 / -1; }
      .note-cell { grid-column: 1 / -1; }
      .delete-btn { grid-column: 1 / -1; justify-self: end; }
      .side-panel { width: 100%; max-width: 100%; padding: 20px; }
      .next-action-row { grid-template-columns: 1fr; }
      .timestamps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  // ──────────────────────────────────────────────
  // STATUS DEFINITIONS
  // ──────────────────────────────────────────────
  const STATUSES = [
    { id: "critical", label: "Critical", color: "#FF0040", description: "Urgent — drop everything" },
    { id: "on_me", label: "On Me", color: "#F59E0B", description: "I need to act" },
    { id: "on_colleague", label: "On Colleague", color: "#8B5CF6", description: "Waiting internally" },
    { id: "on_customer", label: "On Customer", color: "#3B82F6", description: "Waiting on them" },
    { id: "stalled", label: "Stalled", color: "#FFFFFF", description: "Stuck / escalate" },
    { id: "cruising", label: "Cruising", color: "#10B981", description: "Active, no action needed" },
  ];

  const STATUS_PRIORITY = ["critical", "on_me", "on_colleague", "on_customer", "stalled", "cruising"];

  // ──────────────────────────────────────────────
  // STAGNANT THRESHOLDS (in days, per status)
  // Used to compute the stagnant queue at the top of the board.
  // User can override these in the Settings modal.
  // ──────────────────────────────────────────────
  const DEFAULT_THRESHOLDS = {
    critical: 1,
    on_me: 3,
    on_colleague: 5,
    on_customer: 10,
    stalled: 7,
    cruising: 30,
  };

  const LS_THRESHOLDS = "sb-thresholds";

  function loadThresholds() {
    try {
      const raw = localStorage.getItem(LS_THRESHOLDS);
      if (!raw) return { ...DEFAULT_THRESHOLDS };
      const parsed = JSON.parse(raw);
      // Merge with defaults so any newly-added status gets a sensible default
      return { ...DEFAULT_THRESHOLDS, ...parsed };
    } catch {
      return { ...DEFAULT_THRESHOLDS };
    }
  }

  function saveThresholds(t) {
    localStorage.setItem(LS_THRESHOLDS, JSON.stringify(t));
  }

  // ──────────────────────────────────────────────
  // SOLUTION DEFINITIONS
  // ──────────────────────────────────────────────
  const SOLUTIONS = [
    { id: "qms",    label: "QMS",    color: "#06B6D4" },
    { id: "evolve", label: "Evolve", color: "#A78BFA" },
    { id: "iforms", label: "iForms", color: "#FB923C" },
  ];

  // ──────────────────────────────────────────────
  // SALES STAGE DEFINITIONS
  // ──────────────────────────────────────────────
  const SALES_STAGES = [
    { id: 1, label: "1 — Qualification",     color: "#e8eaed" },
    { id: 2, label: "2 — Validation",      color: "#0EA5E9" },
    { id: 3, label: "3 — Design",    color: "#14B8A6" },
    { id: 4, label: "4 — Negotiate",         color: "#84CC16" },
    { id: 5, label: "5 — Procurement",     color: "#EAB308" },
    { id: 6, label: "6 — Closed - Won",  color: "#F97316" },
    { id: 7, label: "7 — Closed - Lost",       color: "#EC4899" },
    { id: 8, label: "8 — Disqualified",   color: "#10B981" },
  ];

  // ──────────────────────────────────────────────
  // SEED DATA
  // Note (formerly nextStep) is a freeform quick note shown inline on the row.
  // nextActionDate + nextActionLabel are the dated commitment shown above the note.
  // ──────────────────────────────────────────────
  const SEED = [
    { id: "1", name: "Acme Corp",    status: "on_me",        note: "Send revised proposal by Friday", solutions: ["qms"],            stage: 5, priority: 1, logo: "", createdAt: Date.now(), nextActionDate: "", nextActionLabel: "", lastStatusChange: Date.now(), lastStageChange: Date.now(), lastTouched: Date.now() },
    { id: "2", name: "GlobalTech",   status: "on_customer",  note: "Waiting on signed SOW",           solutions: ["evolve","iforms"], stage: 7, priority: 1, logo: "", createdAt: Date.now(), nextActionDate: "", nextActionLabel: "", lastStatusChange: Date.now(), lastStageChange: Date.now(), lastTouched: Date.now() },
    { id: "3", name: "Pinnacle Inc", status: "cruising",     note: "",                                solutions: ["qms","evolve"],    stage: 3, priority: 1, logo: "", createdAt: Date.now(), nextActionDate: "", nextActionLabel: "", lastStatusChange: Date.now(), lastStageChange: Date.now(), lastTouched: Date.now() },
  ];

  // ──────────────────────────────────────────────
  // GITHUB SYNC ENGINE
  // ──────────────────────────────────────────────
  const LS_TOKEN = "sb-github-token";
  const LS_REPO  = "sb-github-repo";
  const LS_USER  = "sb-github-user";
  const DATA_FILE = "data.json";

  let fileSha = null;
  let saveTimer = null;

  function getGitHubConfig() {
    return {
      token: localStorage.getItem(LS_TOKEN) || "",
      repo:  localStorage.getItem(LS_REPO)  || "signal-board",
      user:  localStorage.getItem(LS_USER)  || "",
    };
  }

  function saveGitHubConfig(token, user, repo) {
    localStorage.setItem(LS_TOKEN, token);
    localStorage.setItem(LS_USER, user);
    localStorage.setItem(LS_REPO, repo);
  }

  function isConfigured() {
    const c = getGitHubConfig();
    return c.token && c.user && c.repo;
  }

  async function githubLoad() {
    const { token, user, repo } = getGitHubConfig();
    try {
      const res = await fetch(
        `https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,
        { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github.v3+json" } }
      );
      if (res.status === 404) { fileSha = null; return null; }
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const json = await res.json();
      fileSha = json.sha;
      const decoded = atob(json.content.replace(/\n/g, ""));
      return JSON.parse(decoded);
    } catch (e) {
      console.error("GitHub load error:", e);
      return null;
    }
  }

  async function githubSave(accounts) {
    const { token, user, repo } = getGitHubConfig();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(accounts, null, 2))));
    const body = { message: "Update signal board data", content };
    if (fileSha) body.sha = fileSha;

    try {
      const res = await fetch(
        `https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,
        {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github.v3+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        }
      );
      if (!res.ok) throw new Error((await res.json()).message || `GitHub API ${res.status}`);
      const json = await res.json();
      fileSha = json.content.sha;
      return true;
    } catch (e) {
      console.error("GitHub save error:", e);
      return false;
    }
  }

  function updateSyncIndicator() {
    const syncInfo = {
      synced:  { dot: "#10B981", text: "Synced" },
      saving:  { dot: "#F59E0B", text: "Syncing..." },
      error:   { dot: "#EF4444", text: "Sync error" },
      offline: { dot: "rgba(255,255,255,0.25)", text: "Local only" },
      unknown: { dot: "rgba(255,255,255,0.25)", text: "..." },
    }[state.syncStatus];

    const btn = document.getElementById("syncBtn");
    if (!btn || !syncInfo) return;

    const dot = btn.querySelector(".sync-dot");
    if (dot) dot.style.background = syncInfo.dot;
    const label = btn.querySelector(".sync-label");
    if (label) label.textContent = syncInfo.text;
  }

  function debouncedGithubSave(accounts) {
    clearTimeout(saveTimer);
    state.syncStatus = "saving";
    updateSyncIndicator();
    saveTimer = setTimeout(async () => {
      const ok = await githubSave(accounts);
      state.syncStatus = ok ? "synced" : "error";
      state.lastSync = ok ? new Date() : state.lastSync;
      updateSyncIndicator();
    }, 1500);
  }

  // ──────────────────────────────────────────────
  // LOCAL STORAGE FALLBACK
  // ──────────────────────────────────────────────
  const LS_ACCOUNTS = "signal-board-accounts";

  // Migrate an account record to include any newly-introduced fields.
  // Old data may have `nextStep` (now renamed `note`) and may be missing all
  // the new fields (notes, nextActionDate/Label, timestamps).
  function migrateAccount(a) {
    const now = Date.now();
    return {
      ...a,
      solutions: a.solutions || [],
      logo: a.logo || "",
      stage: a.stage ?? null,
      priority: a.priority ?? null,
      // Rename: prefer existing `note`, fall back to legacy `nextStep`, then empty string.
      note: a.note ?? a.nextStep ?? "",
      // New fields
      nextActionDate: a.nextActionDate ?? "",
      nextActionLabel: a.nextActionLabel ?? "",
      // Default timestamps to "now" so existing accounts don't immediately
      // appear stagnant just because they predate this feature.
      lastStatusChange: a.lastStatusChange ?? now,
      lastStageChange: a.lastStageChange ?? now,
      lastTouched: a.lastTouched ?? now,
    };
  }

  function migrateAll(list) {
    return list.map(migrateAccount);
  }

  function localLoad() {
    try {
      const raw = localStorage.getItem(LS_ACCOUNTS);
      if (raw) return migrateAll(JSON.parse(raw));
      return null;
    } catch { return null; }
  }

  function localSave(accounts) {
    localStorage.setItem(LS_ACCOUNTS, JSON.stringify(accounts));
  }

  // ──────────────────────────────────────────────
  // APP STATE
  // ──────────────────────────────────────────────
  let state = {
    accounts: localLoad() || SEED,
    filter: "all",
    solutionFilter: "all",
    stageFilter: "all",
    sortBy: "status",
    editingId: null,
    editingRankId: null,
    showSettings: false,
    syncStatus: "unknown",
    lastSync: null,
    settingsError: "",
    loading: true,
    logoPopup: null,
    logoPreviewUrl: "",
    logoDomain: "",
    // Side panel state
    detailPanelId: null,        // account ID whose detail panel is open, or null
    // Stagnant queue
    thresholds: loadThresholds(),
    stagnantCollapsed: false,   // user can collapse the stagnant section
  };

  // ──────────────────────────────────────────────
  // TIMESTAMP HELPERS
  // ──────────────────────────────────────────────
  const MS_PER_DAY = 24 * 60 * 60 * 1000;

  // Returns a human-friendly relative time, e.g. "3d ago", "2h ago", "just now".
  function relativeTime(ts) {
    if (!ts) return "—";
    const diff = Date.now() - ts;
    if (diff < 60 * 1000) return "just now";
    if (diff < 60 * 60 * 1000) return Math.floor(diff / (60 * 1000)) + "m ago";
    if (diff < MS_PER_DAY) return Math.floor(diff / (60 * 60 * 1000)) + "h ago";
    const days = Math.floor(diff / MS_PER_DAY);
    if (days < 30) return days + "d ago";
    const months = Math.floor(days / 30);
    if (months < 12) return months + "mo ago";
    return Math.floor(months / 12) + "y ago";
  }

  // Returns days elapsed since timestamp (float), or null if no timestamp.
  function daysSince(ts) {
    if (!ts) return null;
    return (Date.now() - ts) / MS_PER_DAY;
  }

  // Format a YYYY-MM-DD date string as "Nov 18" or similar for compact display.
  function formatActionDate(isoDate) {
    if (!isoDate) return "";
    // Parse as local date by appending T00:00, otherwise it can shift a day in some zones.
    const d = new Date(isoDate + "T00:00:00");
    if (isNaN(d.getTime())) return isoDate;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  // Is the given ISO date string in the past (relative to today, local time)?
  function isOverdue(isoDate) {
    if (!isoDate) return false;
    const d = new Date(isoDate + "T23:59:59"); // end of that day in local time
    return d.getTime() < Date.now();
  }

  // ──────────────────────────────────────────────
  // PERSISTENCE
  // ──────────────────────────────────────────────
  function persistAccounts() {
    localSave(state.accounts);
    if (isConfigured()) debouncedGithubSave(state.accounts);
  }

  function update(changes) {
    Object.assign(state, changes);
    persistAccounts();
    render();
  }

  async function initialLoad() {
    if (isConfigured()) {
      state.syncStatus = "saving";
      render();
      const remote = await githubLoad();
      if (remote) {
        state.accounts = migrateAll(remote);
        localSave(state.accounts);
        state.syncStatus = "synced";
        state.lastSync = new Date();
      } else if (localLoad()) {
        state.accounts = localLoad();
        await githubSave(state.accounts);
        state.syncStatus = "synced";
      } else {
        state.accounts = SEED;
        state.syncStatus = "synced";
      }
    } else {
      state.accounts = localLoad() || SEED;
      state.syncStatus = "offline";
    }
    state.loading = false;
    render();
  }

  // ──────────────────────────────────────────────
  // HELPERS
  // ──────────────────────────────────────────────
  function getCounts() {
    return STATUSES.reduce((acc, s) => {
      acc[s.id] = state.accounts.filter(a => a.status === s.id).length;
      return acc;
    }, {});
  }

  function getSolCounts() {
    return SOLUTIONS.reduce((acc, s) => {
      acc[s.id] = state.accounts.filter(a => (a.solutions || []).includes(s.id)).length;
      return acc;
    }, {});
  }

  function getStageCounts() {
    return SALES_STAGES.reduce((acc, s) => {
      acc[s.id] = state.accounts.filter(a => a.stage === s.id).length;
      return acc;
    }, {});
  }

  function getFiltered() {
    let list = state.accounts;
    if (state.filter !== "all") list = list.filter(a => a.status === state.filter);
    if (state.solutionFilter !== "all") list = list.filter(a => (a.solutions || []).includes(state.solutionFilter));
    if (state.stageFilter !== "all") list = list.filter(a => a.stage === state.stageFilter);
    return list;
  }

  function getSorted(filtered) {
    return [...filtered].sort((a, b) => {
      if (state.sortBy === "status") {
        const ai = STATUS_PRIORITY.indexOf(a.status);
        const bi = STATUS_PRIORITY.indexOf(b.status);
        const statusDiff = (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        if (statusDiff !== 0) return statusDiff;
        const ap = a.priority ?? Infinity;
        const bp = b.priority ?? Infinity;
        return ap - bp;
      }
      if (state.sortBy === "alpha") return a.name.localeCompare(b.name);
      return b.createdAt - a.createdAt;
    });
  }

  // Stagnant queue: any account whose `lastTouched` is older than its
  // status-specific threshold. Accounts with no status are excluded
  // (no status = no threshold applies). Returns the list sorted by
  // stagnant-ness (most overdue first).
  function getStagnantAccounts() {
    const list = state.accounts.filter(a => {
      if (!a.status) return false;
      const threshold = state.thresholds[a.status];
      if (!threshold || threshold <= 0) return false;
      const days = daysSince(a.lastTouched);
      return days !== null && days >= threshold;
    });
    // Sort by how far past the threshold each one is (most stagnant first)
    list.sort((a, b) => {
      const aOver = daysSince(a.lastTouched) - state.thresholds[a.status];
      const bOver = daysSince(b.lastTouched) - state.thresholds[b.status];
      return bOver - aOver;
    });
    return list;
  }

  // ──────────────────────────────────────────────
  // TOUCH TRACKING
  // Call touch(acct) any time a meaningful edit happens — this is what
  // resets the stagnant timer. We deliberately do NOT touch on: name edits,
  // logo changes, solution toggles (those are administrative).
  // ──────────────────────────────────────────────
  function touch(acct) {
    if (!acct) return;
    acct.lastTouched = Date.now();
  }

  // ──────────────────────────────────────────────
  // PRIORITY RANK MANAGEMENT
  // ──────────────────────────────────────────────
  function normalizeGroup(statusId) {
    if (!statusId) return;
    const group = state.accounts.filter(a => a.status === statusId);
    group.sort((a, b) => (a.priority ?? Infinity) - (b.priority ?? Infinity));
    group.forEach((acct, i) => { acct.priority = i + 1; });
  }

  function setPriority(id, targetRank) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct || !acct.status) return;

    const target = parseInt(targetRank, 10);
    if (isNaN(target) || target < 1) return;

    normalizeGroup(acct.status);

    const group = state.accounts.filter(a => a.status === acct.status);
    const clamped = Math.min(target, group.length);

    acct.priority = 0;

    const others = group
      .filter(a => a.id !== acct.id)
      .sort((a, b) => a.priority - b.priority);

    let rank = 1;
    others.forEach(other => {
      if (rank === clamped) rank++;
      other.priority = rank++;
    });
    acct.priority = clamped;

    touch(acct);  // rank change counts as a meaningful edit
    update({});
  }

  function assignRankToBottom(acct) {
    if (!acct.status) { acct.priority = null; return; }
    const group = state.accounts.filter(a => a.status === acct.status && a.id !== acct.id);
    acct.priority = group.length + 1;
  }

  // ──────────────────────────────────────────────
  // ACCOUNT ACTIONS
  // ──────────────────────────────────────────────
  function addAccount() {
    const now = Date.now();
    state.accounts.unshift({
      id: now.toString(),
      name: "New Account",
      status: null,
      note: "",
      solutions: [],
      stage: null,
      priority: null,
      logo: "",
      createdAt: now,
      nextActionDate: "",
      nextActionLabel: "",
      lastStatusChange: now,
      lastStageChange: now,
      lastTouched: now,
    });
    state.editingId = state.accounts[0].id;
    update({});
  }

  function deleteAccount(id) {
    const acct = state.accounts.find(a => a.id === id);
    const oldStatus = acct?.status;
    state.accounts = state.accounts.filter(a => a.id !== id);
    if (oldStatus) normalizeGroup(oldStatus);
    // If the detail panel for this account is open, close it.
    if (state.detailPanelId === id) state.detailPanelId = null;
    update({});
  }

  function setStatus(id, statusId) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    const oldStatus = acct.status;
    const newStatus = acct.status === statusId ? null : statusId;

    acct.status = newStatus;

    if (oldStatus && oldStatus !== newStatus) {
      acct.priority = null;
      normalizeGroup(oldStatus);
    }
    if (newStatus && newStatus !== oldStatus) {
      assignRankToBottom(acct);
    }
    if (!newStatus) acct.priority = null;

    // Track timestamps: status changed, and this counts as a touch.
    if (oldStatus !== newStatus) {
      acct.lastStatusChange = Date.now();
      touch(acct);
    }

    update({});
  }

  function setStage(id, stageId) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    const newStage = (stageId === "" || stageId === null) ? null : parseInt(stageId, 10);
    if (acct.stage !== newStage) {
      acct.stage = newStage;
      acct.lastStageChange = Date.now();
      touch(acct);
    }
    update({});
  }

  function toggleSolution(id, solId) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (!acct.solutions) acct.solutions = [];
    const idx = acct.solutions.indexOf(solId);
    if (idx >= 0) acct.solutions.splice(idx, 1);
    else acct.solutions.push(solId);
    // Solution toggle is administrative — does NOT touch (per design decision).
    update({});
  }

  // Note edits (the freeform note field, both inline and in the side panel).
  // This DOES reset the stagnant timer per the user's requirement.
  function setNote(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (acct.note !== value) {
      acct.note = value;
      touch(acct);
    }
    persistAccounts();
  }

  // Next-action date/label edits. Setting either to a non-empty value counts
  // as a touch; clearing both does NOT touch (you're removing intent).
  function setNextActionDate(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (acct.nextActionDate !== value) {
      acct.nextActionDate = value;
      if (value) touch(acct);
    }
    update({});
  }

  function setNextActionLabel(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (acct.nextActionLabel !== value) {
      acct.nextActionLabel = value;
      if (value) touch(acct);
    }
    persistAccounts();
  }

  function clearNextAction(id) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    acct.nextActionDate = "";
    acct.nextActionLabel = "";
    update({});
  }

  function setName(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (acct && value.trim()) acct.name = value.trim();
    state.editingId = null;
    update({});
  }

  function resetBoard() {
    state.accounts = [...SEED];
    state.filter = "all";
    state.solutionFilter = "all";
    state.stageFilter = "all";
    update({});
  }

  // ──────────────────────────────────────────────
  // LOGO HANDLING
  // ──────────────────────────────────────────────
  function openLogoPopup(id) {
    const acct = state.accounts.find(a => a.id === id);
    state.logoPopup = id;
    state.logoDomain = "";
    state.logoPreviewUrl = acct?.logo || "";
    render();
  }

  function closeLogoPopup() {
    state.logoPopup = null;
    render();
  }

  function logoUrlFromDomain(domain) {
    domain = domain.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "").trim();
    if (!domain) return "";
    return `https://logo.clearbit.com/${domain}`;
  }

  function saveLogo(id, url) {
    const acct = state.accounts.find(a => a.id === id);
    if (acct) {
      acct.logo = url;
      update({});
    }
    closeLogoPopup();
  }

  function removeLogo(id) {
    saveLogo(id, "");
  }

  function handleLogoUpload(id, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { saveLogo(id, reader.result); };
    reader.readAsDataURL(file);
  }

  // ──────────────────────────────────────────────
  // DETAIL SIDE PANEL
  // ──────────────────────────────────────────────
  function openDetailPanel(id) {
    state.detailPanelId = id;
    render();
  }

  function closeDetailPanel() {
    state.detailPanelId = null;
    render();
  }

  // ──────────────────────────────────────────────
  // SETTINGS
  // ──────────────────────────────────────────────
  async function testAndSaveConfig(token, user, repo) {
    try {
      const res = await fetch(
        `https://api.github.com/repos/${user}/${repo}`,
        { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github.v3+json" } }
      );
      if (res.status === 401) return "Invalid token. Check that you copied it correctly.";
      if (res.status === 404) return `Repo "${user}/${repo}" not found. Check the name and make sure the token has access.`;
      if (!res.ok) return `GitHub returned an error (${res.status}).`;

      saveGitHubConfig(token, user, repo);
      state.settingsError = "";
      render();

      await githubSave(state.accounts);
      state.syncStatus = "synced";
      state.lastSync = new Date();
      render();
      return null;
    } catch (e) {
      return "Network error. Check your connection.";
    }
  }

  function disconnectGitHub() {
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_USER);
    localStorage.removeItem(LS_REPO);
    fileSha = null;
    state.syncStatus = "offline";
    render();
  }

  // Save the per-status thresholds entered in the Settings modal.
  // Reads the value from each input by status id.
  function saveThresholdsFromInputs() {
    const next = { ...state.thresholds };
    STATUSES.forEach(s => {
      const input = document.getElementById(`threshold-${s.id}`);
      if (!input) return;
      const v = parseInt(input.value, 10);
      if (!isNaN(v) && v > 0) next[s.id] = v;
    });
    state.thresholds = next;
    saveThresholds(next);
  }

  function resetThresholdsToDefaults() {
    state.thresholds = { ...DEFAULT_THRESHOLDS };
    saveThresholds(state.thresholds);
    render();
  }

  // ──────────────────────────────────────────────
  // RENDER
  // ──────────────────────────────────────────────

        html += `

          <div class="side-panel open">

            </div>

            <!-- Notes -->
            <div class="panel-section">

              <textarea class="panel-textarea" id="panelNote" placeholder="Add context, history, anything useful for next time you open this account…">${acct.note || ''}</textarea>
              <div style="font-size:10px;color:rgba(255,255,255,0.3);font-family:'JetBrains Mono',monospace">First line shows on the board.</div>
            </div>

            <!-- Timestamps (read-only) -->
            <div class="panel-section">
              <span class="panel-label">Activity</span>
              <div class="timestamps">
                <div class="ts">

                  <span class="ts-value ${acct.lastStatusChange ? '' : 'muted'}">${relativeTime(acct.lastStatusChange)}</span>

                <div class="ts">

                  <span class="ts-value ${acct.lastStageChange ? '' : 'muted'}">${relativeTime(acct.lastStageChange)}</span>
                </div>

                  <span class="ts-value ${acct.lastTouched ? '' : 'muted'}">${relativeTime(acct.lastTouched)}</span>

              </div>

      }

    // ── Main Board ──
    if (state.loading) {
      html += `<div class="empty" style="padding:80px">Loading...</div>`;
    } else {
      html += `
        <div class="header">
          <div class="header-top">
            <div class="header-left">
              <h1>SIGNAL BOARD</h1>
              <span class="mono count">${state.accounts.length} accounts</span>
            </div>
            <button class="sync-status" id="syncBtn">
              <span class="sync-dot" style="background:${syncInfo.dot};box-shadow:0 0 6px ${syncInfo.dot}66"></span>

              <button class="filter-pill" data-filter="${s.id}" style="
                border-color:${state.filter === s.id ? s.color : 'rgba(255,255,255,0.08)'};

              <span class="count-badge">${stagnant.length}</span>
              <span class="caret">▾</span>
            </div>
            <div class="stagnant-body ${state.stagnantCollapsed ? 'collapsed' : ''}">
              ${stagnant.map(acct => renderAccountRow(acct, true)).join("")}
            </div>
          </div>
        ` : ""}

        <div class="toolbar">
          <div class="sort-btns">
            ${[{key:"status",label:"By Priority"},{key:"alpha",label:"A–Z"},{key:"newest",label:"Newest"}].map(o => `
              <button class="sort-btn ${state.sortBy === o.key ? 'active' : ''}" data-sort="${o.key}">${o.label}</button>
            `).join("")}
          </div>
          <div class="action-btns">
            <button class="btn-reset" id="resetBtn">RESET</button>
            <button class="btn-add" id="addBtn">+ ADD ACCOUNT</button>
          </div>
        </div>

        <div class="col-headers">
          <div>Rank</div><div></div><div>Account</div><div>Solutions</div><div>Stage</div><div>Status</div><div>Note</div><div></div><div></div>
        </div>

        <div class="accounts">
          ${sorted.length === 0 ? `
            <div class="empty">${state.filter === 'all' && state.solutionFilter === 'all' && state.stageFilter === 'all' ? 'No accounts yet. Click + ADD ACCOUNT to get started.' : 'No accounts match these filters.'}</div>
          ` : sorted.map(acct => renderAccountRow(acct, false)).join("")}
        </div>

        <div class="legend">
          ${STATUSES.map(s => `
            <div class="legend-item">
              <span class="legend-dot" style="background:${s.color};box-shadow:0 0 6px ${s.color}66"></span>
              ${s.label} — ${s.description}
            </div>
          `).join("")}
        </div>`;
    }

    app.innerHTML = html;

    attachEventListeners();
  }

  // Extracted so we can render account rows in two places (main list + stagnant section).
  // `inStagnantSection` lets us add the small "stagnant Xd" badge when relevant.
  function renderAccountRow(acct, inStagnantSection) {
    const active = STATUSES.find(s => s.id === acct.status);
    const borderColor = active ? active.color : 'rgba(255,255,255,0.06)';
    const isEditing = state.editingId === acct.id;
    const isEditingRank = state.editingRankId === acct.id;
    const sols = acct.solutions || [];
    const stageRec = acct.stage ? SALES_STAGES.find(s => s.id === acct.stage) : null;

    // Stagnant badge: only shown inside the stagnant section, showing days over threshold
    let stagnantBadge = "";
    if (inStagnantSection && acct.status) {
      const days = Math.floor(daysSince(acct.lastTouched));
      stagnantBadge = `<span class="stagnant-badge" title="No activity for ${days} day(s)">${days}d</span>`;
    }

    // Next action inline display: only shown when a date or label is set.
    // Format: "→ Nov 18 · send revised quote" — gracefully degrades if either is missing.
    let nextActionLine = "";
    if (acct.nextActionDate || acct.nextActionLabel) {
      const overdue = isOverdue(acct.nextActionDate);
      const datePart = acct.nextActionDate ? formatActionDate(acct.nextActionDate) : "";
      const labelPart = acct.nextActionLabel || "";
      const joined = [datePart, labelPart].filter(Boolean).join(" · ");
      nextActionLine = `<div class="next-action-line ${overdue ? 'overdue' : ''}" title="Next action${overdue ? ' (overdue)' : ''}">→ ${joined}</div>`;
    }

    // The inline note shows only the first line (the "glance" view).
    // Full note is edited in the side panel. We escape quotes for the input value.
    const noteFirstLine = (acct.note || "").split("\n")[0];

    return `
      <div class="account-row" data-account-id="${acct.id}" style="border-left-color:${borderColor}">
        ${isEditingRank ? `
          <input class="rank-input" type="number" min="1" data-rank-input="${acct.id}" value="${acct.priority || ''}" />
        ` : `
          <div class="rank-badge ${acct.priority ? '' : 'empty'}" data-edit-rank="${acct.id}"
               title="${acct.status ? 'Click to change priority within ' + (active?.label || '') + ' group' : 'Set a status to enable priority ranking'}">
            ${acct.priority ? '#' + acct.priority : '—'}
          </div>
        `}

        <div class="logo-wrap" data-logo="${acct.id}" title="Click to set logo">
          ${acct.logo
            ? `<img src="${acct.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" /><span class="logo-placeholder" style="display:none">+</span>`
            : `<span class="logo-placeholder">+</span>`}
        </div>

        ${isEditing ? `
          <input class="name-input" data-name-input="${acct.id}" value="${acct.name.replace(/"/g, '&quot;')}" />
        ` : `
          <div class="account-name" data-edit-name="${acct.id}" title="Click to edit name">
            ${acct.name}${stagnantBadge ? ' ' + stagnantBadge : ''}
          </div>
        `}

        <div class="solution-tags">
          ${SOLUTIONS.map(s => {
            const on = sols.includes(s.id);
            return `<span class="sol-tag" data-sol="${acct.id}:${s.id}" style="
              background:${on ? s.color + '22' : 'transparent'};
              color:${on ? s.color : 'rgba(255,255,255,0.15)'};
              border-color:${on ? s.color + '66' : 'rgba(255,255,255,0.06)'};
            ">${s.label}</span>`;
          }).join("")}
        </div>

        <select class="stage-select" data-stage="${acct.id}" style="
          border-left-color:${stageRec ? stageRec.color : 'rgba(255,255,255,0.1)'};
          color:${stageRec ? stageRec.color : 'rgba(255,255,255,0.4)'};
        ">
          <option value="" ${!acct.stage ? 'selected' : ''}>— Stage —</option>
          ${SALES_STAGES.map(s => `
            <option value="${s.id}" ${acct.stage === s.id ? 'selected' : ''}>${s.label}</option>
          `).join("")}
        </select>

        <div class="lights">
          ${STATUSES.map(s => {
            const on = acct.status === s.id;
            return `<button class="light" data-light="${acct.id}:${s.id}"
              title="${s.label}: ${s.description}"
              style="
                border-color:${on ? s.color : 'rgba(255,255,255,0.12)'};
                background:${on ? `radial-gradient(circle at 40% 35%, rgba(255,255,255,0.4) 0%, transparent 60%), ${s.color}` : 'transparent'};
                box-shadow:${on ? `0 0 12px ${s.color}88, 0 0 24px ${s.color}44, inset 0 -2px 4px rgba(0,0,0,0.3)` : 'none'};
              "></button>`;
          }).join("")}
        </div>

        <div class="note-cell">
          ${nextActionLine}
          <input class="note-input" data-note="${acct.id}" value="${(noteFirstLine || '').replace(/"/g, '&quot;')}" placeholder="Quick note..." />
        </div>

        <button class="details-btn" data-details="${acct.id}" title="Open details">›</button>
        <button class="delete-btn" data-delete="${acct.id}" title="Remove account">&times;</button>
      </div>`;
  }

  function attachEventListeners() {
    const app = document.getElementById("app");

    // Logo popup
    app.querySelectorAll("[data-logo]").forEach(el => {
      el.addEventListener("click", () => openLogoPopup(el.dataset.logo));
    });

    const logoOverlay = document.getElementById("logoOverlay");
    if (logoOverlay) logoOverlay.addEventListener("click", e => { if (e.target === logoOverlay) closeLogoPopup(); });

    const logoCancelBtn = document.getElementById("logoCancelBtn");
    if (logoCancelBtn) logoCancelBtn.addEventListener("click", closeLogoPopup);

    const logoDomainInput = document.getElementById("logoDomainInput");
    if (logoDomainInput) {
      const updatePreview = () => {
        const url = logoUrlFromDomain(logoDomainInput.value);
        state.logoDomain = logoDomainInput.value;
        state.logoPreviewUrl = url;
        const area = document.getElementById("logoPreviewArea");
        if (area && url) {
          area.innerHTML = `<img src="${url}" onerror="this.style.display='none'" style="width:40px;height:40px;border-radius:6px;background:rgba(255,255,255,0.06);object-fit:contain" /><span style="font-size:11px;color:rgba(255,255,255,0.3)">Preview</span>`;
          const saveBtn = document.getElementById("logoSaveBtn");
          if (saveBtn) saveBtn.disabled = false;
        }
      };
      logoDomainInput.addEventListener("input", updatePreview);
      logoDomainInput.addEventListener("keydown", e => { if (e.key === "Enter") updatePreview(); });
      logoDomainInput.focus();
    }

    const logoSaveBtn = document.getElementById("logoSaveBtn");
    if (logoSaveBtn) logoSaveBtn.addEventListener("click", () => saveLogo(state.logoPopup, state.logoPreviewUrl));

    const logoRemoveBtn = document.getElementById("logoRemoveBtn");
    if (logoRemoveBtn) logoRemoveBtn.addEventListener("click", () => removeLogo(state.logoPopup));

    const logoFileInput = document.getElementById("logoFileInput");
    if (logoFileInput) {
      logoFileInput.addEventListener("change", e => {
        if (e.target.files[0]) handleLogoUpload(state.logoPopup, e.target.files[0]);
      });
    }

    // Sync / Settings
    const syncBtn = document.getElementById("syncBtn");
    if (syncBtn) syncBtn.addEventListener("click", () => { state.showSettings = true; state.settingsError = ""; render(); });

    // Settings: "Done" closes and persists thresholds
    const settingsClose = document.getElementById("settingsClose");
    if (settingsClose) {
      settingsClose.addEventListener("click", () => {
        saveThresholdsFromInputs();
        state.showSettings = false;
        update({});  // re-render board so stagnant queue reflects new thresholds
      });
    }

    const resetThresholdsBtn = document.getElementById("resetThresholdsBtn");
    if (resetThresholdsBtn) resetThresholdsBtn.addEventListener("click", resetThresholdsToDefaults);

    const disconnectBtn = document.getElementById("disconnectBtn");
    if (disconnectBtn) disconnectBtn.addEventListener("click", disconnectGitHub);

    const overlay = document.getElementById("settingsOverlay");
    if (overlay) overlay.addEventListener("click", e => {
      if (e.target === overlay) {
        saveThresholdsFromInputs();
        state.showSettings = false;
        update({});
      }
    });

    const settingsSave = document.getElementById("settingsSave");
    if (settingsSave) {
      settingsSave.addEventListener("click", async () => {
        const token = document.getElementById("inputToken").value.trim();
        const user  = document.getElementById("inputUser").value.trim();
        const repo  = document.getElementById("inputRepo").value.trim();
        if (!token || !user || !repo) { state.settingsError = "All fields are required."; render(); return; }
        settingsSave.disabled = true;
        settingsSave.textContent = "Testing...";
        const err = await testAndSaveConfig(token, user, repo);
        if (err) { state.settingsError = err; render(); }
      });
    }

    // ── Stagnant section collapse toggle ──
    const stagnantHeader = document.getElementById("stagnantHeader");
    if (stagnantHeader) {
      stagnantHeader.addEventListener("click", () => {
        state.stagnantCollapsed = !state.stagnantCollapsed;
        render();
      });
    }

    // Filters
    app.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        const f = btn.dataset.filter;
        update({ filter: state.filter === f && f !== "all" ? "all" : f });
      });
    });

    app.querySelectorAll("[data-sol-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        const f = btn.dataset.solFilter;
        update({ solutionFilter: state.solutionFilter === f ? "all" : f });
      });
    });

    app.querySelectorAll("[data-stage-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        const f = parseInt(btn.dataset.stageFilter, 10);
        update({ stageFilter: state.stageFilter === f ? "all" : f });
      });
    });

    app.querySelectorAll("[data-stage]").forEach(sel => {
      sel.addEventListener("change", () => setStage(sel.dataset.stage, sel.value));
    });

    // Rank
    app.querySelectorAll("[data-edit-rank]").forEach(el => {
      el.addEventListener("click", () => {
        const id = el.dataset.editRank;
        const acct = state.accounts.find(a => a.id === id);
        if (!acct || !acct.status) return;
        state.editingRankId = id;
        render();
      });
    });

    app.querySelectorAll("[data-rank-input]").forEach(input => {
      const commit = () => {
        const id = input.dataset.rankInput;
        const val = input.value.trim();
        state.editingRankId = null;
        if (val === "") { render(); return; }
        setPriority(id, val);
      };
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") input.blur();
        if (e.key === "Escape") { state.editingRankId = null; render(); }
      });
      input.focus();
      input.select();
    });

    // Sort
    app.querySelectorAll("[data-sort]").forEach(btn => {
      btn.addEventListener("click", () => update({ sortBy: btn.dataset.sort }));
    });

    // Add / Reset
    const addBtn = document.getElementById("addBtn");
    if (addBtn) addBtn.addEventListener("click", addAccount);
    const resetBtn = document.getElementById("resetBtn");
    if (resetBtn) resetBtn.addEventListener("click", resetBoard);

    // Edit name
    app.querySelectorAll("[data-edit-name]").forEach(el => {
      el.addEventListener("click", () => {
        state.editingId = el.dataset.editName;
        render();
        const input = app.querySelector(`[data-name-input="${el.dataset.editName}"]`);
        if (input) { input.focus(); input.select(); }
      });
    });

    app.querySelectorAll("[data-name-input]").forEach(input => {
      const id = input.dataset.nameInput;
      input.addEventListener("blur", () => setName(id, input.value));
      input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    });

    // Signal lights
    app.querySelectorAll("[data-light]").forEach(btn => {
      btn.addEventListener("click", () => {
        const [id, statusId] = btn.dataset.light.split(":");
        setStatus(id, statusId);
      });
    });

    // Solution tags
    app.querySelectorAll("[data-sol]").forEach(el => {
      el.addEventListener("click", () => {
        const [id, solId] = el.dataset.sol.split(":");
        toggleSolution(id, solId);
      });
    });

    // Inline note input (formerly nextStep).
    // Saves on blur. Since this is the "first line" view, typing here
    // replaces the first line of the note while preserving any subsequent
    // lines the user may have entered in the side-panel textarea.
    app.querySelectorAll("[data-note]").forEach(input => {
      input.addEventListener("blur", () => {
        const id = input.dataset.note;
        const acct = state.accounts.find(a => a.id === id);
        if (!acct) return;
        const newFirstLine = input.value;
        const existingLines = (acct.note || "").split("\n");
        existingLines[0] = newFirstLine;
        const combined = existingLines.join("\n");
        // Trim trailing empty lines so a single-line note stays single-line
        setNote(id, combined.replace(/\n+$/, ""));
      });
      input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    });

    // Delete
    app.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => deleteAccount(btn.dataset.delete));
    });

    // ── Details (›) → open side panel ──
    app.querySelectorAll("[data-details]").forEach(btn => {
      btn.addEventListener("click", () => openDetailPanel(btn.dataset.details));
    });

    // ── Side panel: close handlers ──
    const panelClose = document.getElementById("panelCloseBtn");
    if (panelClose) panelClose.addEventListener("click", closeDetailPanel);

    const panelBackdrop = document.getElementById("panelBackdrop");
    if (panelBackdrop) panelBackdrop.addEventListener("click", closeDetailPanel);

    // ── Side panel: note textarea ──
    // Saves on blur. Full multi-line note lives here; first line shows on the row.
    const panelNote = document.getElementById("panelNote");
    if (panelNote && state.detailPanelId) {
      panelNote.addEventListener("blur", () => {
        setNote(state.detailPanelId, panelNote.value);
        render();  // re-render so the inline row note reflects the new first line
      });
    }

    // ── Side panel: next action date & label ──
    const panelActionDate = document.getElementById("panelActionDate");
    if (panelActionDate && state.detailPanelId) {
      panelActionDate.addEventListener("change", () => {
        setNextActionDate(state.detailPanelId, panelActionDate.value);
      });
    }

    const panelActionLabel = document.getElementById("panelActionLabel");
    if (panelActionLabel && state.detailPanelId) {
      panelActionLabel.addEventListener("blur", () => {
        setNextActionLabel(state.detailPanelId, panelActionLabel.value);
        render();  // re-render so the row reflects the new label
      });
      panelActionLabel.addEventListener("keydown", e => { if (e.key === "Enter") panelActionLabel.blur(); });
    }

    const panelActionClear = document.getElementById("panelActionClear");
    if (panelActionClear && state.detailPanelId) {
      panelActionClear.addEventListener("click", () => clearNextAction(state.detailPanelId));
    }

    // Auto-focus name input
    if (state.editingId) {
      const input = app.querySelector(`[data-name-input="${state.editingId}"]`);
      if (input) { input.focus(); input.select(); }
    }
  }

  // ── Global Esc handler: close whichever overlay is on top ──
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (state.logoPopup) { closeLogoPopup(); return; }
    if (state.showSettings) {
      saveThresholdsFromInputs();
      state.showSettings = false;
      update({});
      return;
    }
    if (state.detailPanelId) { closeDetailPanel(); return; }
  });

  // ── Boot ──
  render();
  initialLoad();
</script>
</body>
</html>
