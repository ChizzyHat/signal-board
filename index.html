<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #000000 0%, #374151 50%, #39393F 100%); 
      color: #F1F1F1;
      font-family: 'Ubuntu', sans-serif;
      padding: 24px 28px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .mono { font-family: 'Ubuntu Mono', monospace; }

    /* ── Header ── */
    .header { margin-bottom: 28px; }
    .header-top { display: flex; align-items: baseline; gap: 12px; justify-content: space-between; }
    .header-left { display: flex; align-items: baseline; gap: 12px; }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: inline;
    }

    .header .count {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }

    /* ── Sync Status Indicator ── */
    .sync-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      transition: all 0.2s;
    }

    .sync-status:hover {
      border-color: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
    }

    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Settings Panel ── */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .settings-panel {
      background: #1A1F2E;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .settings-panel h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
    }

    .settings-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .settings-section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    .settings-section h3 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
      color: #F1F1F1;
    }

    .settings-panel label {
      display: block;
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    .settings-panel label:first-of-type { margin-top: 0; }

    .settings-panel input[type="text"],
    .settings-panel input[type="password"],
    .settings-panel input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #F1F1F1;
      font-size: 13px;
      font-family: 'Ubuntu Mono', monospace;
      outline: none;
    }

    .settings-panel input:focus { border-color: rgba(255,255,255,0.3); }

    .settings-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      margin-top: 4px;
      line-height: 1.5;
    }

    .settings-hint a { color: #3B82F6; text-decoration: none; }
    .settings-hint a:hover { text-decoration: underline; }

    .settings-buttons {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      justify-content: flex-end;
    }

    /* Threshold row: status label + dot + days input */
    .threshold-row {
      display: grid;
      grid-template-columns: 16px 1fr 72px auto;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }

    .threshold-row .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .threshold-row .label {
      font-size: 13px;
      color: #F1F1F1;
    }

    .threshold-row input[type="number"] {
      width: 72px;
      padding: 6px 8px;
      text-align: right;
      font-size: 12px;
    }

    .threshold-row .unit {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-family: 'Ubuntu Mono', monospace;
    }

    /* ── Settings Tabs ──
       Horizontal tab strip across the top of the settings panel. */
    .settings-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .settings-tab {
      padding: 8px 14px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      font-family: 'Ubuntu Mono', monospace;
      letter-spacing: 0.04em;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }

    .settings-tab:hover { color: rgba(255,255,255,0.7); }

    .settings-tab.active {
      color: #F1F1F1;
      border-bottom-color: #3B82F6;
    }

    /* ── Config Item Row ──
       Editable row for a status / solution / stage in the config editor. */
    .config-item {
      display: grid;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      margin-bottom: 6px;
    }

    /* Statuses: reorder | color | label | description | usage | delete */
    .config-item.config-status {
      grid-template-columns: 44px 32px 1fr 1.4fr 50px 32px;
    }

    /* Solutions: color | label | usage | delete */
    .config-item.config-solution {
      grid-template-columns: 32px 1fr 50px 32px;
    }

    /* Stages: reorder | color | label | closing? | usage | delete */
    .config-item.config-stage {
      grid-template-columns: 44px 32px 1fr 64px 50px 32px;
    }

    .config-item input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      color: #F1F1F1;
      font-size: 13px;
      font-family: 'Ubuntu', sans-serif;
      outline: none;
    }

    .config-item input[type="text"]:focus {
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.07);
    }

    .config-item input[type="color"] {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .config-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    .config-item input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

    .config-item .reorder-btns {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .config-item .reorder-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5);
      width: 20px;
      height: 14px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 8px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Ubuntu Mono', monospace;
    }

    .config-item .reorder-btn:hover:not(:disabled) {
      color: #F1F1F1;
      border-color: rgba(255,255,255,0.25);
    }

    .config-item .reorder-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }

    .config-item .usage-count {
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }

    .config-item .usage-count.in-use {
      color: rgba(255,255,255,0.6);
    }

    .config-item .delete-config-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.3);
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .config-item .delete-config-btn:hover {
      color: #EF4444;
      border-color: #EF4444;
    }

    .config-item .delete-config-btn:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .config-item .closing-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .config-item .closing-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #6B7280;
    }

    .config-item.system-item {
      background: rgba(107, 114, 128, 0.08);
      border-color: rgba(107, 114, 128, 0.2);
    }

    .system-badge {
      font-size: 9px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      display: inline-block;
    }

    .config-list-header {
      display: grid;
      align-items: center;
      gap: 8px;
      padding: 0 8px 6px;
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .config-list-header.for-status   { grid-template-columns: 44px 32px 1fr 1.4fr 50px 32px; }
    .config-list-header.for-solution { grid-template-columns: 32px 1fr 50px 32px; }
    .config-list-header.for-stage    { grid-template-columns: 44px 32px 1fr 64px 50px 32px; }

    .config-add-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px dashed rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: 'Ubuntu Mono', monospace;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .config-add-btn:hover {
      border-color: rgba(255,255,255,0.35);
      color: #F1F1F1;
    }

    .config-help {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    /* Blocking modal shown when user tries to delete an in-use config item */
    .config-block-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 110;
      backdrop-filter: blur(4px);
    }

    .config-block-inner {
      background: #1A1F2E;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 20px 24px;
      max-width: 380px;
      width: 90%;
    }

    .config-block-inner h4 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #EF4444;
    }

    .config-block-inner p {
      font-size: 12px;
      line-height: 1.6;
      color: rgba(255,255,255,0.7);
      margin-bottom: 14px;
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-family: 'Ubuntu', sans-serif;
      cursor: pointer;
    }

    .btn-primary {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      background: #3B82F6;
      color: #FFF;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Ubuntu', sans-serif;
      cursor: pointer;
    }

    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .settings-error {
      color: #EF4444;
      font-size: 12px;
      margin-top: 12px;
      font-family: 'Ubuntu Mono', monospace;
    }

    /* ── Filter Pills (status + solutions) ── */
    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .filter-pill {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Solution Tag Badges ── */
    .solution-tags { display: flex; gap: 4px; flex-wrap: wrap; }

    .sol-tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid;
      user-select: none;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .sort-btns { display: flex; gap: 4px; }

    .sort-btn {
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      cursor: pointer;
    }

    .sort-btn.active {
      background: rgba(255,255,255,0.1);
      color: #F1F1F1;
    }

    /* ── Show Closed toggle ──
       Small pill-style toggle in the toolbar that hides/shows status="closed" accounts.
       Persisted to localStorage; off by default so daily view stays focused. */
    .show-closed-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .show-closed-toggle:hover {
      border-color: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.75);
    }

    .show-closed-toggle.active {
      border-color: #6B7280;
      background: rgba(107, 114, 128, 0.18);
      color: #D1D5DB;
    }

    .show-closed-toggle .checkbox {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      line-height: 1;
    }

    .show-closed-toggle.active .checkbox {
      background: #6B7280;
      border-color: #6B7280;
      color: #FFF;
    }

    .show-closed-toggle .count {
      color: rgba(255,255,255,0.4);
      font-size: 10px;
    }

    .show-closed-toggle.active .count {
      color: rgba(255,255,255,0.6);
    }

    .action-btns { display: flex; gap: 8px; }

    .btn-reset {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      cursor: pointer;
    }

    .btn-add {
      padding: 6px 16px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #F1F1F1;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Ubuntu', sans-serif;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    /* ── Stagnant Queue Section ──
       Lives at the top of the board when any account exceeds its threshold. */
    .stagnant-section {
      margin-bottom: 20px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(245,158,11,0.06) 0%, rgba(245,158,11,0.02) 100%);
      overflow: hidden;
    }

    .stagnant-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .stagnant-header:hover {
      background: rgba(245, 158, 11, 0.05);
    }

    .stagnant-header .title {
      font-size: 12px;
      font-weight: 700;
      font-family: 'Ubuntu Mono', monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #F59E0B;
    }

    .stagnant-header .count-badge {
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(245, 158, 11, 0.8);
      background: rgba(245, 158, 11, 0.12);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .stagnant-header .caret {
      margin-left: auto;
      font-size: 11px;
      color: rgba(245, 158, 11, 0.6);
      transition: transform 0.2s;
      font-family: 'Ubuntu Mono', monospace;
    }

    .stagnant-header.collapsed .caret {
      transform: rotate(-90deg);
    }

    .stagnant-body {
      padding: 0 12px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stagnant-body.collapsed {
      display: none;
    }

    /* Small "stagnant Xd" badge shown inside each stagnant row */
    .stagnant-badge {
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      color: #F59E0B;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* ── Column Headers ── */
    .col-headers {
      display: grid;
      /* rank | logo | name | solutions | stage | lights | note(+nextAction) | details | delete */
      grid-template-columns: 40px 32px 160px 70px 100px auto 1fr 28px 36px;
      gap: 12px;
      padding: 0 16px 8px;
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Account Rows ── */
    .accounts { display: flex; flex-direction: column; gap: 4px; }

    .account-row {
      display: grid;
      /* Must match .col-headers grid-template-columns above */
      grid-template-columns: 40px 32px 160px 85px 100px auto 1fr 28px 36px;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border-left: 4px solid rgba(255,255,255,0.06);
      transition: all 0.2s ease;
    }

    /* ── Logo Thumbnail ── */
    .logo-wrap {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-placeholder {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      font-family: 'Ubuntu Mono', monospace;
    }

    .logo-wrap:hover .logo-placeholder { color: rgba(255,255,255,0.5); }

    .logo-file-input { display: none; }

    .account-name {
      color: #F1F1F1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .name-input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      color: #F1F1F1;
      padding: 4px 8px;
      font-size: 14px;
      font-family: 'Ubuntu', sans-serif;
      outline: none;
      width: 100%;
    }

    .lights { display: flex; gap: 6px; align-items: center; }

    /* ── Priority Rank Badge ── */
    .rank-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 24px;
      width: 36px;
      border-radius: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.55);
      font-family: 'Ubuntu Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .rank-badge.empty { color: rgba(255,255,255,0.2); }

    .rank-badge:hover {
      border-color: rgba(255,255,255,0.25);
      color: #F1F1F1;
      background: rgba(255,255,255,0.08);
    }

    .rank-input {
      width: 36px;
      height: 24px;
      padding: 0 4px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      color: #F1F1F1;
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      font-weight: 600;
      text-align: center;
      outline: none;
      -moz-appearance: textfield;
    }
    .rank-input::-webkit-outer-spin-button,
    .rank-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ── Sales Stage Dropdown ── */
    .stage-select {
      width: 100%;
      height: 26px;
      padding: 0 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      outline: none;
      cursor: pointer;
      border-left-width: 3px;
    }

    .stage-select:hover { border-color: rgba(255,255,255,0.25); }
    .stage-select:focus { border-color: rgba(255,255,255,0.4); }
    .stage-select option { background: #1A1F2E; color: #F1F1F1; }

    .light {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
    }

    /* ── Note cell ──
       Wrapper allowing optional nextAction line above the inline note input. */
    .note-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .next-action-line {
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.55);
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-action-line.overdue {
      color: #F87171; /* muted red */
    }

    .note-input {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: rgba(255,255,255,0.6);
      padding: 4px 8px;
      font-size: 13px;
      font-family: 'Ubuntu', sans-serif;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }

    .note-input:hover { border-color: rgba(255,255,255,0.08); }
    .note-input:focus { border-color: rgba(255,255,255,0.15); }

    /* ── Details (›) button ── */
    .details-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 16px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      padding: 0;
      font-family: 'Ubuntu Mono', monospace;
    }

    .details-btn:hover {
      color: #F1F1F1;
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.2);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: #EF4444; }

    .empty {
      text-align: center;
      padding: 40px;
      color: rgba(255,255,255,0.25);
      font-size: 13px;
      font-family: 'Ubuntu Mono', monospace;
    }

    /* ── Legend ── */
    .legend {
      margin-top: 32px;
      padding: 16px 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-family: 'Ubuntu Mono', monospace;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ── Logo Popup ── */
    .logo-popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .logo-popup-inner {
      background: #1A1F2E;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
    }

    .logo-popup-inner h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .logo-popup-inner input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #F1F1F1;
      font-size: 13px;
      font-family: 'Ubuntu Mono', monospace;
      outline: none;
      margin-bottom: 8px;
    }

    .logo-popup-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      min-height: 40px;
    }

    .logo-popup-preview img {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      object-fit: contain;
    }

    .logo-popup-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    /* ── Filter separator ── */
    .filter-sep {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.1);
      margin: 0 4px;
      align-self: center;
    }

    /* ── Side Panel (Account Detail) ──
       Slides in from the right when the user clicks the › button on a row. */
    .side-panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      backdrop-filter: blur(2px);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .side-panel-backdrop.open { opacity: 1; }

    .side-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 90%;
      max-width: 460px;
      background: #131826;
      border-left: 1px solid rgba(255,255,255,0.08);
      z-index: 91;
      padding: 24px 28px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .side-panel.open { transform: translateX(0); }

    .side-panel-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .side-panel-header .logo-mini {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .side-panel-header .logo-mini img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .side-panel-header h2 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-panel-close {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      font-family: 'Ubuntu Mono', monospace;
    }

    .side-panel-close:hover {
      color: #F1F1F1;
      border-color: rgba(255,255,255,0.25);
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-section .panel-label {
      font-size: 10px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Next action row: date + label side by side */
    .next-action-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px;
    }

    .panel-input,
    .panel-textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #F1F1F1;
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'Ubuntu', sans-serif;
      outline: none;
    }

    .panel-input { font-family: 'Ubuntu Mono', monospace; }

    .panel-input:focus,
    .panel-textarea:focus { border-color: rgba(255,255,255,0.3); }

    .panel-textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Read-only timestamps grid (last status / stage / touched) */
    .timestamps {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .timestamps .ts {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .timestamps .ts-label {
      font-size: 9px;
      font-family: 'Ubuntu Mono', monospace;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .timestamps .ts-value {
      font-size: 12px;
      font-family: 'Ubuntu Mono', monospace;
      color: #F1F1F1;
    }

    .timestamps .ts-value.muted {
      color: rgba(255,255,255,0.3);
    }

    .next-action-clear {
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      font-family: 'Ubuntu Mono', monospace;
      cursor: pointer;
      align-self: flex-start;
      padding: 0;
      text-decoration: underline;
    }

    .next-action-clear:hover { color: #EF4444; }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      body { padding: 16px; }
      .col-headers { display: none; }
      .account-row {
        grid-template-columns: 40px 32px 1fr 28px;
        gap: 8px;
        padding: 14px 16px;
      }
      .stage-select { grid-column: 1 / -1; }
      .lights { grid-column: 1 / -1; }
      .solution-tags { grid-column: 1 / -1; }
      .note-cell { grid-column: 1 / -1; }
      .delete-btn { grid-column: 1 / -1; justify-self: end; }
      .side-panel { width: 100%; max-width: 100%; padding: 20px; }
      .next-action-row { grid-template-columns: 1fr; }
      .timestamps { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
  // ══════════════════════════════════════════════════════════════════
  // USER-EDITABLE CONFIG
  // ──────────────────────────────────────────────────────────────────
  // Statuses, solutions, and stages used to be hardcoded constants.
  // They now live in a config object that the user can edit via the
  // Configuration section of the Settings modal.
  //
  // The hardcoded values below serve TWO purposes:
  //   1. Initial defaults for brand-new users (generic placeholders)
  //   2. Migration target: existing users get their previous customizations
  //      preserved on first load with this new code (see migrateConfig)
  //
  // Throughout the rest of the code, runtime references to STATUSES,
  // SOLUTIONS, SALES_STAGES, STATUS_PRIORITY, CLOSING_STAGES are wired
  // to read from state.config via getter functions below. This keeps
  // the existing code shape mostly unchanged.
  // ══════════════════════════════════════════════════════════════════

  // System status IDs that cannot be deleted (but can be renamed/recolored/reordered).
  // The "closed" ID in particular has special behavior elsewhere in the code
  // (Show Closed toggle, auto-close from stage, skip-from-stagnant).
  const SYSTEM_STATUS_IDS = ["closed"];

  // Generic placeholder defaults — these are what NEW users see.
  // The migration step below will replace these with the user's previous
  // customizations if they have any.
  const GENERIC_STATUS_DEFAULTS = [
    { id: "critical",     label: "Critical",     color: "#FF0040", description: "Urgent — drop everything" },
    { id: "on_me",        label: "On Me",        color: "#F59E0B", description: "I need to act" },
    { id: "on_colleague", label: "On Colleague", color: "#8B5CF6", description: "Waiting internally" },
    { id: "on_customer",  label: "On Customer",  color: "#3B82F6", description: "Waiting on them" },
    { id: "stalled",      label: "Stalled",      color: "#FFFFFF", description: "Stuck / escalate" },
    { id: "cruising",     label: "Cruising",     color: "#10B981", description: "Active, no action needed" },
    { id: "closed",       label: "Closed",       color: "#6B7280", description: "Deal closed, archived" },
  ];

  const GENERIC_SOLUTION_DEFAULTS = [
    { id: "product_a", label: "Product A", color: "#06B6D4" },
    { id: "product_b", label: "Product B", color: "#A78BFA" },
    { id: "product_c", label: "Product C", color: "#FB923C" },
  ];

  const GENERIC_STAGE_DEFAULTS = [
    { id: 1, label: "1 — Prospect",       color: "#e8eaed", closing: false },
    { id: 2, label: "2 — Qualification",  color: "#0EA5E9", closing: false },
    { id: 3, label: "3 — Discovery",      color: "#14B8A6", closing: false },
    { id: 4, label: "4 — Proposal",       color: "#84CC16", closing: false },
    { id: 5, label: "5 — Negotiation",    color: "#EAB308", closing: false },
    { id: 6, label: "6 — Closed - Won",   color: "#F97316", closing: true  },
    { id: 7, label: "7 — Closed - Lost",  color: "#EC4899", closing: true  },
    { id: 8, label: "8 — Disqualified",   color: "#10B981", closing: true  },
  ];

  // The "previous version" defaults — what the code used to ship with
  // before this config refactor. The migration uses these to detect
  // existing users whose data was created against the OLD defaults so
  // we can seed their editable config with their previous customizations
  // (your QMS/Evolve/iForms, your stage labels, etc.).
  const LEGACY_STATUS_DEFAULTS = [
    { id: "critical",     label: "Critical",     color: "#FF0040", description: "Urgent — drop everything" },
    { id: "on_me",        label: "On Me",        color: "#F59E0B", description: "I need to act" },
    { id: "on_colleague", label: "On Colleague", color: "#8B5CF6", description: "Waiting internally" },
    { id: "on_customer",  label: "On Customer",  color: "#3B82F6", description: "Waiting on them" },
    { id: "stalled",      label: "Stalled",      color: "#FFFFFF", description: "Stuck / escalate" },
    { id: "cruising",     label: "Cruising",     color: "#10B981", description: "Active, no action needed" },
    { id: "closed",       label: "Closed",       color: "#6B7280", description: "Deal closed, archived" },
  ];

  const LEGACY_SOLUTION_DEFAULTS = [
    { id: "qms",    label: "QMS",    color: "#06B6D4" },
    { id: "evolve", label: "Evolve", color: "#A78BFA" },
    { id: "iforms", label: "iForms", color: "#FB923C" },
  ];

  const LEGACY_STAGE_DEFAULTS = [
    { id: 1, label: "1 — Qualification",  color: "#e8eaed", closing: false },
    { id: 2, label: "2 — Validation",     color: "#0EA5E9", closing: false },
    { id: 3, label: "3 — Design",         color: "#14B8A6", closing: false },
    { id: 4, label: "4 — Negotiate",      color: "#84CC16", closing: false },
    { id: 5, label: "5 — Procurement",    color: "#EAB308", closing: false },
    { id: 6, label: "6 — Closed - Won",   color: "#F97316", closing: true  },
    { id: 7, label: "7 — Closed - Lost",  color: "#EC4899", closing: true  },
    { id: 8, label: "8 — Disqualified",   color: "#10B981", closing: true  },
  ];

  const LS_CONFIG = "sb-config";

  // Detect whether the user has existing data that uses the legacy (pre-config)
  // hardcoded values. We look at localStorage accounts for telltale IDs.
  // Returns true if we find any account using legacy-specific IDs.
  function hasLegacyData() {
    try {
      const raw = localStorage.getItem("signal-board-accounts");
      if (!raw) return false;
      const accounts = JSON.parse(raw);
      // The clearest signal: solutions IDs "qms", "evolve", "iforms" — these
      // are unique to the legacy defaults, not the generic ones.
      const legacySolutionIds = new Set(["qms", "evolve", "iforms"]);
      return accounts.some(a => (a.solutions || []).some(s => legacySolutionIds.has(s)));
    } catch {
      return false;
    }
  }

  // Generate a stable ID from a label. Used when the user adds a new
  // config item. Falls back to a random suffix if the slug isn't unique.
  function slugify(label, existingIds) {
    const base = (label || "item")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "_")
      .replace(/^_|_$/g, "")
      .slice(0, 30) || "item";
    if (!existingIds.includes(base)) return base;
    let i = 2;
    while (existingIds.includes(`${base}_${i}`)) i++;
    return `${base}_${i}`;
  }

  // Generate a stable numeric ID for a new stage (max existing + 1).
  function nextStageId(stages) {
    if (!stages.length) return 1;
    return Math.max(...stages.map(s => s.id)) + 1;
  }

  // Load config from localStorage, falling back to defaults appropriate
  // for this user (legacy customizations for existing users, generic
  // placeholders for new users).
  function loadConfig() {
    try {
      const raw = localStorage.getItem(LS_CONFIG);
      if (raw) {
        const parsed = JSON.parse(raw);
        // Defensive: ensure all three arrays exist
        return {
          statuses:  parsed.statuses  || GENERIC_STATUS_DEFAULTS.map(s => ({ ...s })),
          solutions: parsed.solutions || GENERIC_SOLUTION_DEFAULTS.map(s => ({ ...s })),
          stages:    parsed.stages    || GENERIC_STAGE_DEFAULTS.map(s => ({ ...s })),
        };
      }
    } catch {}

    // First load with this version: pick defaults based on whether
    // existing data looks legacy or fresh.
    const useLegacy = hasLegacyData();
    const defaults = {
      statuses:  (useLegacy ? LEGACY_STATUS_DEFAULTS  : GENERIC_STATUS_DEFAULTS).map(s => ({ ...s })),
      solutions: (useLegacy ? LEGACY_SOLUTION_DEFAULTS : GENERIC_SOLUTION_DEFAULTS).map(s => ({ ...s })),
      stages:    (useLegacy ? LEGACY_STAGE_DEFAULTS   : GENERIC_STAGE_DEFAULTS).map(s => ({ ...s })),
    };
    // Persist immediately so future loads are deterministic
    try { localStorage.setItem(LS_CONFIG, JSON.stringify(defaults)); } catch {}
    return defaults;
  }

  function saveConfig(cfg) {
    try { localStorage.setItem(LS_CONFIG, JSON.stringify(cfg)); } catch {}
  }

  // ── Runtime accessors ──
  // The rest of the code reads STATUSES, SOLUTIONS, SALES_STAGES,
  // STATUS_PRIORITY, and CLOSING_STAGES as if they were constants.
  // They're actually mutable references refreshed by syncConfigRefs()
  // whenever the config changes. This keeps the existing code shape
  // unchanged while making the config user-editable underneath.
  let STATUSES        = [];
  let SOLUTIONS       = [];
  let SALES_STAGES    = [];
  let STATUS_PRIORITY = [];
  let CLOSING_STAGES  = [];

  function syncConfigRefs() {
    STATUSES        = state.config.statuses;
    SOLUTIONS       = state.config.solutions;
    SALES_STAGES    = state.config.stages;
    STATUS_PRIORITY = state.config.statuses.map(s => s.id);
    CLOSING_STAGES  = state.config.stages.filter(s => s.closing).map(s => s.id);
  }

  // ──────────────────────────────────────────────
  // STAGNANT THRESHOLDS (in days, per status)
  // Used to compute the stagnant queue at the top of the board.
  // ──────────────────────────────────────────────
  // Defaults shipped with the app — only used as fallback for status IDs
  // that aren't yet in the user's thresholds map. Custom user statuses
  // get a sensible default applied when added (7 days).
  const DEFAULT_THRESHOLDS = {
    critical: 1,
    on_me: 3,
    on_colleague: 5,
    on_customer: 10,
    stalled: 7,
    cruising: 30,
    // Closed accounts are skipped from the stagnant check in code,
    // but we keep a value here so the threshold UI doesn't show a blank.
    closed: 365,
  };

  const NEW_STATUS_DEFAULT_THRESHOLD = 7;

  const LS_THRESHOLDS = "sb-thresholds";

  function loadThresholds() {
    try {
      const raw = localStorage.getItem(LS_THRESHOLDS);
      if (!raw) return { ...DEFAULT_THRESHOLDS };
      const parsed = JSON.parse(raw);
      // Merge with defaults so any newly-added status gets a sensible default
      return { ...DEFAULT_THRESHOLDS, ...parsed };
    } catch {
      return { ...DEFAULT_THRESHOLDS };
    }
  }

  function saveThresholds(t) {
    localStorage.setItem(LS_THRESHOLDS, JSON.stringify(t));
  }

  // ── Show-closed toggle persistence ──
  // Whether the user wants Closed-status accounts to appear in the main list.
  // Defaults to false (hidden) so closed deals don't clutter the daily view.
  const LS_SHOW_CLOSED = "sb-show-closed";

  function loadShowClosed() {
    return localStorage.getItem(LS_SHOW_CLOSED) === "true";
  }

  function saveShowClosed(v) {
    localStorage.setItem(LS_SHOW_CLOSED, v ? "true" : "false");
  }

  // ──────────────────────────────────────────────
  // SEED DATA (only used for first-ever load on a fresh device)
  // ──────────────────────────────────────────────
  const SEED = [
    { id: "1", name: "Acme Corp",    status: "on_me",        note: "Send revised proposal by Friday", solutions: ["qms"],            stage: 5, priority: 1, logo: "", createdAt: Date.now(), nextActionDate: "", nextActionLabel: "", lastStatusChange: Date.now(), lastStageChange: Date.now(), lastTouched: Date.now() },
    { id: "2", name: "GlobalTech",   status: "on_customer",  note: "Waiting on signed SOW",           solutions: ["evolve","iforms"], stage: 7, priority: 1, logo: "", createdAt: Date.now(), nextActionDate: "", nextActionLabel: "", lastStatusChange: Date.now(), lastStageChange: Date.now(), lastTouched: Date.now() },
    { id: "3", name: "Pinnacle Inc", status: "cruising",     note: "",                                solutions: ["qms","evolve"],    stage: 3, priority: 1, logo: "", createdAt: Date.now(), nextActionDate: "", nextActionLabel: "", lastStatusChange: Date.now(), lastStageChange: Date.now(), lastTouched: Date.now() },
  ];

  // ──────────────────────────────────────────────
  // GITHUB SYNC ENGINE
  // ──────────────────────────────────────────────
  const LS_TOKEN = "sb-github-token";
  const LS_REPO  = "sb-github-repo";
  const LS_USER  = "sb-github-user";
  const DATA_FILE = "data.json";

  let fileSha = null;
  let saveTimer = null;

  function getGitHubConfig() {
    return {
      token: localStorage.getItem(LS_TOKEN) || "",
      repo:  localStorage.getItem(LS_REPO)  || "signal-board",
      user:  localStorage.getItem(LS_USER)  || "",
    };
  }

  function saveGitHubConfig(token, user, repo) {
    localStorage.setItem(LS_TOKEN, token);
    localStorage.setItem(LS_USER, user);
    localStorage.setItem(LS_REPO, repo);
  }

  function isConfigured() {
    const c = getGitHubConfig();
    return c.token && c.user && c.repo;
  }

  // GitHub data.json shape:
  //   Legacy (pre-config): a JSON array of account objects.
  //   New: an object { accounts: [...], config: {...} }
  // We detect the legacy shape on load and treat it as accounts-only.
  async function githubLoad() {
    const { token, user, repo } = getGitHubConfig();
    try {
      const res = await fetch(
        `https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,
        { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github.v3+json" } }
      );
      if (res.status === 404) { fileSha = null; return null; }
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const json = await res.json();
      fileSha = json.sha;
      const decoded = atob(json.content.replace(/\n/g, ""));
      const parsed = JSON.parse(decoded);
      // Back-compat: a bare array means accounts-only (legacy format).
      if (Array.isArray(parsed)) return { accounts: parsed, config: null };
      return { accounts: parsed.accounts || [], config: parsed.config || null };
    } catch (e) {
      console.error("GitHub load error:", e);
      return null;
    }
  }

  async function githubSave(accounts) {
    const { token, user, repo } = getGitHubConfig();
    // Save accounts AND config together so other devices see the same
    // statuses/solutions/stages.
    const payload = { accounts, config: state.config };
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    const body = { message: "Update signal board data", content };
    if (fileSha) body.sha = fileSha;

    try {
      const res = await fetch(
        `https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,
        {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: "application/vnd.github.v3+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        }
      );
      if (!res.ok) throw new Error((await res.json()).message || `GitHub API ${res.status}`);
      const json = await res.json();
      fileSha = json.content.sha;
      return true;
    } catch (e) {
      console.error("GitHub save error:", e);
      return false;
    }
  }

  function updateSyncIndicator() {
    const syncInfo = {
      synced:  { dot: "#10B981", text: "Synced" },
      saving:  { dot: "#F59E0B", text: "Syncing..." },
      error:   { dot: "#EF4444", text: "Sync error" },
      offline: { dot: "rgba(255,255,255,0.25)", text: "Local only" },
      unknown: { dot: "rgba(255,255,255,0.25)", text: "..." },
    }[state.syncStatus];

    const btn = document.getElementById("syncBtn");
    if (!btn || !syncInfo) return;

    const dot = btn.querySelector(".sync-dot");
    if (dot) dot.style.background = syncInfo.dot;
    const label = btn.querySelector(".sync-label");
    if (label) label.textContent = syncInfo.text;
  }

  function debouncedGithubSave(accounts) {
    clearTimeout(saveTimer);
    state.syncStatus = "saving";
    updateSyncIndicator();
    saveTimer = setTimeout(async () => {
      const ok = await githubSave(accounts);
      state.syncStatus = ok ? "synced" : "error";
      state.lastSync = ok ? new Date() : state.lastSync;
      updateSyncIndicator();
    }, 1500);
  }

  // ──────────────────────────────────────────────
  // LOCAL STORAGE FALLBACK
  // ──────────────────────────────────────────────
  const LS_ACCOUNTS = "signal-board-accounts";

  // Migrate an account record to include any newly-introduced fields.
  // Old data may have `nextStep` (now renamed `note`) and may be missing all
  // the new fields (notes, nextActionDate/Label, timestamps).
  function migrateAccount(a) {
    const now = Date.now();
    return {
      ...a,
      solutions: a.solutions || [],
      logo: a.logo || "",
      stage: a.stage ?? null,
      priority: a.priority ?? null,
      // Rename: prefer existing `note`, fall back to legacy `nextStep`, then empty string.
      note: a.note ?? a.nextStep ?? "",
      // New fields
      nextActionDate: a.nextActionDate ?? "",
      nextActionLabel: a.nextActionLabel ?? "",
      // Default timestamps to "now" so existing accounts don't immediately
      // appear stagnant just because they predate this feature.
      lastStatusChange: a.lastStatusChange ?? now,
      lastStageChange: a.lastStageChange ?? now,
      lastTouched: a.lastTouched ?? now,
    };
  }

  function migrateAll(list) {
    return list.map(migrateAccount);
  }

  function localLoad() {
    try {
      const raw = localStorage.getItem(LS_ACCOUNTS);
      if (raw) return migrateAll(JSON.parse(raw));
      return null;
    } catch { return null; }
  }

  function localSave(accounts) {
    localStorage.setItem(LS_ACCOUNTS, JSON.stringify(accounts));
  }

  // ──────────────────────────────────────────────
  // APP STATE
  // ──────────────────────────────────────────────
  let state = {
    accounts: localLoad() || SEED,
    filter: "all",
    solutionFilter: "all",
    stageFilter: "all",
    sortBy: "status",
    editingId: null,
    editingRankId: null,
    showSettings: false,
    syncStatus: "unknown",
    lastSync: null,
    settingsError: "",
    loading: true,
    logoPopup: null,
    logoPreviewUrl: "",
    logoDomain: "",
    // Side panel state
    detailPanelId: null,        // account ID whose detail panel is open, or null
    // Stagnant queue
    thresholds: loadThresholds(),
    stagnantCollapsed: false,   // user can collapse the stagnant section
    // Show-closed toggle (persisted): when false, accounts with status="closed"
    // are hidden from the main list, the stagnant queue, and the visible counts.
    showClosed: loadShowClosed(),
    // User-editable config: statuses, solutions, stages.
    config: loadConfig(),
    // Settings modal: which section is expanded (only one at a time, accordion-style)
    settingsTab: "sync",  // one of: "sync", "thresholds", "statuses", "solutions", "stages"
    // Confirmation dialog for blocked delete attempts in the config editor
    configBlockMessage: "",
  };

  // Initialize runtime config refs immediately so any code path below sees them.
  syncConfigRefs();


  // ──────────────────────────────────────────────
  // TIMESTAMP HELPERS
  // ──────────────────────────────────────────────
  const MS_PER_DAY = 24 * 60 * 60 * 1000;

  // Returns a human-friendly relative time, e.g. "3d ago", "2h ago", "just now".
  function relativeTime(ts) {
    if (!ts) return "—";
    const diff = Date.now() - ts;
    if (diff < 60 * 1000) return "just now";
    if (diff < 60 * 60 * 1000) return Math.floor(diff / (60 * 1000)) + "m ago";
    if (diff < MS_PER_DAY) return Math.floor(diff / (60 * 60 * 1000)) + "h ago";
    const days = Math.floor(diff / MS_PER_DAY);
    if (days < 30) return days + "d ago";
    const months = Math.floor(days / 30);
    if (months < 12) return months + "mo ago";
    return Math.floor(months / 12) + "y ago";
  }

  // Returns days elapsed since timestamp (float), or null if no timestamp.
  function daysSince(ts) {
    if (!ts) return null;
    return (Date.now() - ts) / MS_PER_DAY;
  }

  // Format a YYYY-MM-DD date string as "Nov 18" or similar for compact display.
  function formatActionDate(isoDate) {
    if (!isoDate) return "";
    // Parse as local date by appending T00:00, otherwise it can shift a day in some zones.
    const d = new Date(isoDate + "T00:00:00");
    if (isNaN(d.getTime())) return isoDate;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  // Is the given ISO date string in the past (relative to today, local time)?
  function isOverdue(isoDate) {
    if (!isoDate) return false;
    const d = new Date(isoDate + "T23:59:59"); // end of that day in local time
    return d.getTime() < Date.now();
  }

  // ──────────────────────────────────────────────
  // PERSISTENCE
  // ──────────────────────────────────────────────
  function persistAccounts() {
    localSave(state.accounts);
    if (isConfigured()) debouncedGithubSave(state.accounts);
  }

  function update(changes) {
    Object.assign(state, changes);
    persistAccounts();
    render();
  }

  async function initialLoad() {
    if (isConfigured()) {
      state.syncStatus = "saving";
      render();
      const remote = await githubLoad();
      if (remote && remote.accounts && remote.accounts.length) {
        state.accounts = migrateAll(remote.accounts);
        // If the remote payload has a config, adopt it. Otherwise keep
        // the local one (which was just seeded for first-time use).
        if (remote.config && remote.config.statuses && remote.config.solutions && remote.config.stages) {
          state.config = remote.config;
          saveConfig(state.config);
          syncConfigRefs();
        }
        localSave(state.accounts);
        state.syncStatus = "synced";
        state.lastSync = new Date();
      } else if (localLoad()) {
        state.accounts = localLoad();
        await githubSave(state.accounts);
        state.syncStatus = "synced";
      } else {
        state.accounts = SEED;
        state.syncStatus = "synced";
      }
    } else {
      state.accounts = localLoad() || SEED;
      state.syncStatus = "offline";
    }
    state.loading = false;
    render();
  }

  // ──────────────────────────────────────────────
  // HELPERS
  // ──────────────────────────────────────────────

  // Base list respecting the Show-Closed toggle.
  // When showClosed is false, accounts with status === "closed" are filtered out
  // of every visible surface: main list, counts, stagnant queue. They remain in
  // state.accounts so the data is preserved.
  // Exception: when the user explicitly filters to status === "closed", we let
  // those accounts through regardless — otherwise the Closed filter pill would
  // do nothing when Show Closed is off.
  function visibleAccounts() {
    if (state.showClosed) return state.accounts;
    if (state.filter === "closed") return state.accounts;
    return state.accounts.filter(a => a.status !== "closed");
  }

  function getCounts() {
    // Status pill counts: each status uses the appropriate base list so the
    // numbers match what's actually visible. The "closed" count always reflects
    // the true count of closed accounts (so you can see how many are archived).
    const counts = {};
    const base = visibleAccounts();
    STATUSES.forEach(s => {
      if (s.id === "closed") {
        // Always show the true count of closed accounts
        counts[s.id] = state.accounts.filter(a => a.status === s.id).length;
      } else {
        counts[s.id] = base.filter(a => a.status === s.id).length;
      }
    });
    return counts;
  }

  function getSolCounts() {
    const base = visibleAccounts();
    return SOLUTIONS.reduce((acc, s) => {
      acc[s.id] = base.filter(a => (a.solutions || []).includes(s.id)).length;
      return acc;
    }, {});
  }

  function getStageCounts() {
    const base = visibleAccounts();
    return SALES_STAGES.reduce((acc, s) => {
      acc[s.id] = base.filter(a => a.stage === s.id).length;
      return acc;
    }, {});
  }

  function getFiltered() {
    let list = visibleAccounts();
    if (state.filter !== "all") list = list.filter(a => a.status === state.filter);
    if (state.solutionFilter !== "all") list = list.filter(a => (a.solutions || []).includes(state.solutionFilter));
    if (state.stageFilter !== "all") list = list.filter(a => a.stage === state.stageFilter);
    return list;
  }

  function getSorted(filtered) {
    return [...filtered].sort((a, b) => {
      if (state.sortBy === "status") {
        const ai = STATUS_PRIORITY.indexOf(a.status);
        const bi = STATUS_PRIORITY.indexOf(b.status);
        const statusDiff = (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        if (statusDiff !== 0) return statusDiff;
        const ap = a.priority ?? Infinity;
        const bp = b.priority ?? Infinity;
        return ap - bp;
      }
      if (state.sortBy === "alpha") return a.name.localeCompare(b.name);
      return b.createdAt - a.createdAt;
    });
  }

  // Stagnant queue: any account whose `lastTouched` is older than its
  // status-specific threshold. Accounts with no status are excluded
  // (no status = no threshold applies). Closed accounts are skipped
  // unconditionally — archived deals should never be flagged stagnant.
  // Returns the list sorted by stagnant-ness (most overdue first).
  function getStagnantAccounts() {
    const list = state.accounts.filter(a => {
      if (!a.status) return false;
      if (a.status === "closed") return false;   // never flag closed deals
      const threshold = state.thresholds[a.status];
      if (!threshold || threshold <= 0) return false;
      const days = daysSince(a.lastTouched);
      return days !== null && days >= threshold;
    });
    // Sort by how far past the threshold each one is (most stagnant first)
    list.sort((a, b) => {
      const aOver = daysSince(a.lastTouched) - state.thresholds[a.status];
      const bOver = daysSince(b.lastTouched) - state.thresholds[b.status];
      return bOver - aOver;
    });
    return list;
  }

  // ──────────────────────────────────────────────
  // TOUCH TRACKING
  // Call touch(acct) any time a meaningful edit happens — this is what
  // resets the stagnant timer. We deliberately do NOT touch on: name edits,
  // logo changes, solution toggles (those are administrative).
  // ──────────────────────────────────────────────
  function touch(acct) {
    if (!acct) return;
    acct.lastTouched = Date.now();
  }

  // ──────────────────────────────────────────────
  // PRIORITY RANK MANAGEMENT
  // ──────────────────────────────────────────────
  function normalizeGroup(statusId) {
    if (!statusId) return;
    const group = state.accounts.filter(a => a.status === statusId);
    group.sort((a, b) => (a.priority ?? Infinity) - (b.priority ?? Infinity));
    group.forEach((acct, i) => { acct.priority = i + 1; });
  }

  function setPriority(id, targetRank) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct || !acct.status) return;

    const target = parseInt(targetRank, 10);
    if (isNaN(target) || target < 1) return;

    normalizeGroup(acct.status);

    const group = state.accounts.filter(a => a.status === acct.status);
    const clamped = Math.min(target, group.length);

    acct.priority = 0;

    const others = group
      .filter(a => a.id !== acct.id)
      .sort((a, b) => a.priority - b.priority);

    let rank = 1;
    others.forEach(other => {
      if (rank === clamped) rank++;
      other.priority = rank++;
    });
    acct.priority = clamped;

    touch(acct);  // rank change counts as a meaningful edit
    update({});
  }

  function assignRankToBottom(acct) {
    if (!acct.status) { acct.priority = null; return; }
    const group = state.accounts.filter(a => a.status === acct.status && a.id !== acct.id);
    acct.priority = group.length + 1;
  }

  // ──────────────────────────────────────────────
  // ACCOUNT ACTIONS
  // ──────────────────────────────────────────────
  function addAccount() {
    const now = Date.now();
    state.accounts.unshift({
      id: now.toString(),
      name: "New Account",
      status: null,
      note: "",
      solutions: [],
      stage: null,
      priority: null,
      logo: "",
      createdAt: now,
      nextActionDate: "",
      nextActionLabel: "",
      lastStatusChange: now,
      lastStageChange: now,
      lastTouched: now,
    });
    state.editingId = state.accounts[0].id;
    update({});
  }

  function deleteAccount(id) {
    const acct = state.accounts.find(a => a.id === id);
    const oldStatus = acct?.status;
    state.accounts = state.accounts.filter(a => a.id !== id);
    if (oldStatus) normalizeGroup(oldStatus);
    // If the detail panel for this account is open, close it.
    if (state.detailPanelId === id) state.detailPanelId = null;
    update({});
  }

  function setStatus(id, statusId) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    const oldStatus = acct.status;
    const newStatus = acct.status === statusId ? null : statusId;

    acct.status = newStatus;

    if (oldStatus && oldStatus !== newStatus) {
      acct.priority = null;
      normalizeGroup(oldStatus);
    }
    if (newStatus && newStatus !== oldStatus) {
      assignRankToBottom(acct);
    }
    if (!newStatus) acct.priority = null;

    // Track timestamps: status changed, and this counts as a touch.
    if (oldStatus !== newStatus) {
      acct.lastStatusChange = Date.now();
      touch(acct);
    }

    update({});
  }

  function setStage(id, stageId) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    const newStage = (stageId === "" || stageId === null) ? null : parseInt(stageId, 10);
    if (acct.stage !== newStage) {
      const wasClosing = CLOSING_STAGES.includes(acct.stage);
      const isClosing = CLOSING_STAGES.includes(newStage);

      acct.stage = newStage;
      acct.lastStageChange = Date.now();
      touch(acct);

      // Auto-set status to "closed" as a one-time nudge when entering a closing
      // stage (6 Won / 7 Lost / 8 Disqualified) from a non-closing stage.
      // This fires only on the transition, not while the account is already in
      // a closing stage. The reverse direction (moving away from 6/7/8) does
      // NOT clear the closed status — that's left to manual control.
      if (isClosing && !wasClosing && acct.status !== "closed") {
        const oldStatus = acct.status;
        acct.status = "closed";
        acct.lastStatusChange = Date.now();
        // Re-rank: leaving old group cleanly, joining the closed group at bottom.
        if (oldStatus) {
          acct.priority = null;
          normalizeGroup(oldStatus);
        }
        assignRankToBottom(acct);
      }
    }
    update({});
  }

  function toggleSolution(id, solId) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (!acct.solutions) acct.solutions = [];
    const idx = acct.solutions.indexOf(solId);
    if (idx >= 0) acct.solutions.splice(idx, 1);
    else acct.solutions.push(solId);
    // Solution toggle is administrative — does NOT touch (per design decision).
    update({});
  }

  // Note edits (the freeform note field, both inline and in the side panel).
  // This DOES reset the stagnant timer per the user's requirement.
  function setNote(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (acct.note !== value) {
      acct.note = value;
      touch(acct);
    }
    persistAccounts();
  }

  // Next-action date/label edits. Setting either to a non-empty value counts
  // as a touch; clearing both does NOT touch (you're removing intent).
  function setNextActionDate(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (acct.nextActionDate !== value) {
      acct.nextActionDate = value;
      if (value) touch(acct);
    }
    update({});
  }

  function setNextActionLabel(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    if (acct.nextActionLabel !== value) {
      acct.nextActionLabel = value;
      if (value) touch(acct);
    }
    persistAccounts();
  }

  function clearNextAction(id) {
    const acct = state.accounts.find(a => a.id === id);
    if (!acct) return;
    acct.nextActionDate = "";
    acct.nextActionLabel = "";
    update({});
  }

  function setName(id, value) {
    const acct = state.accounts.find(a => a.id === id);
    if (acct && value.trim()) acct.name = value.trim();
    state.editingId = null;
    update({});
  }

  function resetBoard() {
    state.accounts = [...SEED];
    state.filter = "all";
    state.solutionFilter = "all";
    state.stageFilter = "all";
    update({});
  }

  // ──────────────────────────────────────────────
  // LOGO HANDLING
  // ──────────────────────────────────────────────
  function openLogoPopup(id) {
    const acct = state.accounts.find(a => a.id === id);
    state.logoPopup = id;
    state.logoDomain = "";
    state.logoPreviewUrl = acct?.logo || "";
    render();
  }

  function closeLogoPopup() {
    state.logoPopup = null;
    render();
  }

  function logoUrlFromDomain(domain) {
    domain = domain.replace(/^https?:\/\//, "").replace(/^www\./, "").replace(/\/.*$/, "").trim();
    if (!domain) return "";
    return `https://logo.clearbit.com/${domain}`;
  }

  function saveLogo(id, url) {
    const acct = state.accounts.find(a => a.id === id);
    if (acct) {
      acct.logo = url;
      update({});
    }
    closeLogoPopup();
  }

  function removeLogo(id) {
    saveLogo(id, "");
  }

  function handleLogoUpload(id, file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { saveLogo(id, reader.result); };
    reader.readAsDataURL(file);
  }

  // ──────────────────────────────────────────────
  // DETAIL SIDE PANEL
  // ──────────────────────────────────────────────
  function openDetailPanel(id) {
    state.detailPanelId = id;
    render();
  }

  function closeDetailPanel() {
    state.detailPanelId = null;
    render();
  }

  // ──────────────────────────────────────────────
  // SETTINGS
  // ──────────────────────────────────────────────
  async function testAndSaveConfig(token, user, repo) {
    try {
      const res = await fetch(
        `https://api.github.com/repos/${user}/${repo}`,
        { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github.v3+json" } }
      );
      if (res.status === 401) return "Invalid token. Check that you copied it correctly.";
      if (res.status === 404) return `Repo "${user}/${repo}" not found. Check the name and make sure the token has access.`;
      if (!res.ok) return `GitHub returned an error (${res.status}).`;

      saveGitHubConfig(token, user, repo);
      state.settingsError = "";
      render();

      await githubSave(state.accounts);
      state.syncStatus = "synced";
      state.lastSync = new Date();
      render();
      return null;
    } catch (e) {
      return "Network error. Check your connection.";
    }
  }

  function disconnectGitHub() {
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_USER);
    localStorage.removeItem(LS_REPO);
    fileSha = null;
    state.syncStatus = "offline";
    render();
  }

  // Save the per-status thresholds entered in the Settings modal.
  // Reads the value from each input by status id.
  function saveThresholdsFromInputs() {
    const next = { ...state.thresholds };
    STATUSES.forEach(s => {
      const input = document.getElementById(`threshold-${s.id}`);
      if (!input) return;
      const v = parseInt(input.value, 10);
      if (!isNaN(v) && v > 0) next[s.id] = v;
    });
    state.thresholds = next;
    saveThresholds(next);
  }

  function resetThresholdsToDefaults() {
    state.thresholds = { ...DEFAULT_THRESHOLDS };
    saveThresholds(state.thresholds);
    render();
  }

  // ══════════════════════════════════════════════════════════════════
  // CONFIG EDITOR CRUD
  // ──────────────────────────────────────────────────────────────────
  // Functions that mutate state.config (statuses, solutions, stages),
  // persist the change, refresh the runtime refs, and re-render.
  // ══════════════════════════════════════════════════════════════════

  // Persist current config to localStorage and refresh runtime refs.
  // Also pushes to GitHub (debounced) so other devices stay in sync.
  // Does not re-render — callers do that.
  function commitConfig() {
    saveConfig(state.config);
    syncConfigRefs();
    if (isConfigured()) debouncedGithubSave(state.accounts);
  }

  // Count how many accounts reference a given config item, so the editor
  // can show usage info and block deletes of in-use items.
  function countUsage(type, id) {
    if (type === "status")   return state.accounts.filter(a => a.status === id).length;
    if (type === "solution") return state.accounts.filter(a => (a.solutions || []).includes(id)).length;
    if (type === "stage")    return state.accounts.filter(a => a.stage === id).length;
    return 0;
  }

  // ── STATUS CRUD ──
  function updateStatus(id, patch) {
    const s = state.config.statuses.find(x => x.id === id);
    if (!s) return;
    Object.assign(s, patch);
    commitConfig();
    render();
  }

  function deleteStatus(id) {
    // System statuses can never be deleted
    if (SYSTEM_STATUS_IDS.includes(id)) {
      state.configBlockMessage = "This is a system status and cannot be deleted (you can rename or recolor it).";
      render();
      return;
    }
    const usage = countUsage("status", id);
    if (usage > 0) {
      const s = state.config.statuses.find(x => x.id === id);
      state.configBlockMessage = `Can't delete "${s?.label || id}" — ${usage} account${usage === 1 ? ' uses' : 's use'} this status. Reassign ${usage === 1 ? 'it' : 'them'} first.`;
      render();
      return;
    }
    state.config.statuses = state.config.statuses.filter(s => s.id !== id);
    // Also remove the threshold entry for this status so it doesn't dangle
    delete state.thresholds[id];
    saveThresholds(state.thresholds);
    commitConfig();
    render();
  }

  function addStatus() {
    const existingIds = state.config.statuses.map(s => s.id);
    const newId = slugify("new_status", existingIds);
    state.config.statuses.push({
      id: newId,
      label: "New Status",
      color: "#94A3B8",
      description: "",
    });
    // Insert before "closed" if present, so Closed stays at the end
    const closedIdx = state.config.statuses.findIndex(s => s.id === "closed");
    if (closedIdx !== -1 && closedIdx !== state.config.statuses.length - 1) {
      const added = state.config.statuses.pop();
      state.config.statuses.splice(closedIdx, 0, added);
    }
    // Give the new status a default threshold so it participates in stagnant tracking
    state.thresholds[newId] = NEW_STATUS_DEFAULT_THRESHOLD;
    saveThresholds(state.thresholds);
    commitConfig();
    render();
  }

  function moveStatus(id, dir) {
    const list = state.config.statuses;
    const i = list.findIndex(s => s.id === id);
    if (i === -1) return;
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    commitConfig();
    render();
  }

  // ── SOLUTION CRUD ──
  function updateSolution(id, patch) {
    const s = state.config.solutions.find(x => x.id === id);
    if (!s) return;
    Object.assign(s, patch);
    commitConfig();
    render();
  }

  function deleteSolution(id) {
    const usage = countUsage("solution", id);
    if (usage > 0) {
      const s = state.config.solutions.find(x => x.id === id);
      state.configBlockMessage = `Can't delete "${s?.label || id}" — ${usage} account${usage === 1 ? ' uses' : 's use'} this solution. Reassign ${usage === 1 ? 'it' : 'them'} first.`;
      render();
      return;
    }
    state.config.solutions = state.config.solutions.filter(s => s.id !== id);
    commitConfig();
    render();
  }

  function addSolution() {
    const existingIds = state.config.solutions.map(s => s.id);
    const newId = slugify("new_solution", existingIds);
    state.config.solutions.push({
      id: newId,
      label: "New Solution",
      color: "#94A3B8",
    });
    commitConfig();
    render();
  }

  // ── STAGE CRUD ──
  function updateStage(id, patch) {
    const s = state.config.stages.find(x => x.id === id);
    if (!s) return;
    Object.assign(s, patch);
    commitConfig();
    render();
  }

  function deleteStage(id) {
    const usage = countUsage("stage", id);
    if (usage > 0) {
      const s = state.config.stages.find(x => x.id === id);
      state.configBlockMessage = `Can't delete "${s?.label || id}" — ${usage} account${usage === 1 ? ' uses' : 's use'} this stage. Reassign ${usage === 1 ? 'it' : 'them'} first.`;
      render();
      return;
    }
    state.config.stages = state.config.stages.filter(s => s.id !== id);
    commitConfig();
    render();
  }

  function addStage() {
    const newId = nextStageId(state.config.stages);
    state.config.stages.push({
      id: newId,
      label: `${newId} — New Stage`,
      color: "#94A3B8",
      closing: false,
    });
    commitConfig();
    render();
  }

  function moveStage(id, dir) {
    const list = state.config.stages;
    const i = list.findIndex(s => s.id === id);
    if (i === -1) return;
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    commitConfig();
    render();
  }

  function dismissConfigBlock() {
    state.configBlockMessage = "";
    render();
  }

  // ──────────────────────────────────────────────
  // RENDER

  function render() {

    let html = "";

    // ── Settings Modal (tabbed: sync, thresholds, statuses, solutions, stages) ──

      // Helper to render the GitHub Sync section

      const stagesSection = `

        <div class="config-list-header for-stage">
          <div></div><div></div><div>Label</div><div>Closing</div><div>Used</div><div></div>
        </div>
        ${state.config.stages.map((s, i) => {
          const usage = countUsage("stage", s.id);
          return `
            <div class="config-item config-stage">
              <div class="reorder-btns">
                <button class="reorder-btn" data-stage-move="${s.id}:-1" ${i === 0 ? 'disabled' : ''} title="Move up">▲</button>
                <button class="reorder-btn" data-stage-move="${s.id}:1"  ${i === state.config.stages.length - 1 ? 'disabled' : ''} title="Move down">▼</button>
              </div>
              <input type="color" data-stage-color="${s.id}" value="${s.color}" title="Pick color" />
              <input type="text" data-stage-label="${s.id}" value="${(s.label || '').replace(/"/g, '&quot;')}" placeholder="Stage name" />
              <div class="closing-toggle">
                <input type="checkbox" data-stage-closing="${s.id}" ${s.closing ? 'checked' : ''} title="Auto-close on entry" />

              <button class="delete-config-btn" data-stage-delete="${s.id}" title="Delete stage">×</button>
            </div>
          `;
        }).join("")}
        <button class="config-add-btn" id="addStageBtn">+ Add stage</button>
      `;

      const sections = {
        sync: { title: "Cross-Device Sync", body: syncSection },
        thresholds: { title: "Stagnant Thresholds", body: thresholdsSection },
        statuses: { title: "Statuses", body: statusesSection },
        solutions: { title: "Solutions", body: solutionsSection },
        stages: { title: "Stages", body: stagesSection },

      const current = sections[tab] || sections.sync;

      html += `
        <div class="settings-overlay" id="settingsOverlay">
          <div class="settings-panel">
            <h2>Settings</h2>
            <div class="settings-tabs">
              <button class="settings-tab ${tab === 'sync' ? 'active' : ''}" data-tab="sync">SYNC</button>
              <button class="settings-tab ${tab === 'thresholds' ? 'active' : ''}" data-tab="thresholds">THRESHOLDS</button>
              <button class="settings-tab ${tab === 'statuses' ? 'active' : ''}" data-tab="statuses">STATUSES</button>
              <button class="settings-tab ${tab === 'solutions' ? 'active' : ''}" data-tab="solutions">SOLUTIONS</button>

        const stageRec = acct.stage ? SALES_STAGES.find(s => s.id === acct.stage) : null;

        html += `

            <div class="side-panel-header">

    }

    // ── Main Board ──
    if (state.loading) {
      html += `<div class="empty" style="padding:80px">Loading...</div>`;
    } else {
      html += `
        <div class="header">
          <div class="header-top">
            <div class="header-left">
              <h1>SIGNAL BOARD</h1>
              <span class="mono count">${state.accounts.length} accounts</span>
            </div>
            <button class="sync-status" id="syncBtn">
