<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange:        #F97316;
      --orange-dim:    rgba(249,115,22,0.15);
      --orange-glow:   rgba(249,115,22,0.35);
      --orange-border: rgba(249,115,22,0.3);
      --bg:            #0c0d10;
      --panel:         #111318;
      --panel-2:       #161920;
      --border:        rgba(255,255,255,0.06);
      --border-mid:    rgba(255,255,255,0.1);
      --text-primary:  #e8eaf0;
      --text-secondary:rgba(255,255,255,0.45);
      --text-dim:      rgba(255,255,255,0.18);
      --c-critical:    #ff4525;
      --c-onme:        #F97316;
      --c-colleague:   #a78bfa;
      --c-customer:    #38bdf8;
      --c-stalled:     #94a3b8;
      --c-cruising:    #86efac;
      --c-closed:      #4b5563;
      --font-display:  'Barlow Condensed', sans-serif;
      --font-body:     'Barlow', sans-serif;
      --font-mono:     'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    select, input, button, textarea { font-family: inherit; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text-primary);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: var(--bg);
      background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 22px 22px;
      /* ── BACKGROUND PHOTO — uncomment to restore ──
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 30%, rgba(0,0,0,0.40) 55%, rgba(0,0,0,0.58) 100%),
        url("https://storage.googleapis.com/quadient_iforms_bucket/Signal%20Board/Picture1.png");
      background-size: 22px 22px, cover, cover;
      background-position: center, center, center;
      */
    }

    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    }

    #app { position: relative; z-index: 1; padding: 20px 24px 40px; }

    /* ── HEADER ── */
    .header { margin-bottom: 18px; }
    .header-top {
      display: flex; align-items: stretch; gap: 0;
      justify-content: space-between;
      border: 1px solid var(--border-mid);
      border-radius: 10px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(249,115,22,0.04), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .header-brand {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px;
      border-right: 1px solid var(--border);
    }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 7px;
      background: var(--orange);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 18px var(--orange-glow);
      flex-shrink: 0;
    }
    .brand-icon svg { width: 16px; height: 16px; }
    .brand-name {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-primary); line-height: 1;
    }
    .brand-name span { color: var(--orange); }

    .header-stats { display: flex; align-items: stretch; flex: 1; }
    .stat-block {
      display: flex; flex-direction: column; justify-content: center;
      padding: 10px 20px; border-right: 1px solid var(--border);
      gap: 2px; min-width: 100px;
    }
    .stat-val {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700; letter-spacing: -0.01em;
      color: var(--text-primary); line-height: 1;
    }
    .stat-val.orange { color: var(--orange); text-shadow: 0 0 20px var(--orange-glow); }
    .stat-lbl {
      font-family: var(--font-mono);
      font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-dim);
    }

    .sync-status {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px;
      font-family: var(--font-mono); font-size: 10px;
      color: var(--text-secondary);
      background: transparent; border: none; cursor: pointer;
      letter-spacing: 0.06em; margin-left: auto;
      transition: color 0.15s;
    }
    .sync-status:hover { color: var(--text-primary); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* ── FILTERS ── */
    .filters { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .filter-pill {
      padding: 4px 12px; border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text-secondary);
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .filter-pill:hover { border-color: var(--border-mid); color: var(--text-primary); }
    .filter-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .filter-sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; align-self: center; }

    /* ── STAGNANT ── */
    .stagnant-section {
      margin-bottom: 16px;
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(249,115,22,0.06) 0%, rgba(249,115,22,0.02) 100%);
      overflow: hidden;
    }
    .stagnant-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; cursor: pointer; user-select: none;
      transition: background 0.15s;
    }
    .stagnant-header:hover { background: rgba(249,115,22,0.04); }
    .s-icon {
      width: 18px; height: 18px; border-radius: 4px;
      background: var(--orange-dim); border: 1px solid var(--orange-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--orange); flex-shrink: 0;
      font-family: var(--font-display); font-weight: 700;
    }
    .stagnant-header .title {
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange);
    }
    .stagnant-header .count-badge {
      font-family: var(--font-mono); font-size: 10px;
      color: rgba(249,115,22,0.8);
      background: rgba(249,115,22,0.12); padding: 1px 8px; border-radius: 10px;
    }
    .stagnant-header .caret {
      margin-left: auto; font-size: 11px; color: rgba(249,115,22,0.5);
      font-family: var(--font-mono); transition: transform 0.2s;
    }
    .stagnant-header.collapsed .caret { transform: rotate(-90deg); }
    .stagnant-body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 3px; }
    .stagnant-body.collapsed { display: none; }
    .stagnant-badge {
      font-family: var(--font-mono); font-size: 9px;
      color: var(--orange); background: var(--orange-dim);
      border: 1px solid var(--orange-border);
      padding: 1px 6px; border-radius: 10px; white-space: nowrap;
    }
    .stagnant-reset {
      font-family: var(--font-mono); font-size: 9px;
      color: rgba(249,115,22,0.6); background: transparent;
      border: 1px solid rgba(249,115,22,0.22);
      padding: 1px 6px; border-radius: 10px; white-space: nowrap;
      cursor: pointer; margin-left: 4px; letter-spacing: 0.05em;
      transition: all 0.15s; user-select: none;
    }
    .stagnant-reset:hover { color: var(--orange); background: var(--orange-dim); border-color: var(--orange-border); }
    .stagnant-reset:active { transform: scale(0.95); }

    /* ── TOOLBAR ── */
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .sort-btns { display: flex; gap: 2px; }
    .sort-btn {
      padding: 5px 12px; border-radius: 4px; border: none;
      background: transparent; color: var(--text-dim);
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.08em; cursor: pointer; transition: all 0.15s;
    }
    .sort-btn:hover { color: var(--text-secondary); }
    .sort-btn.active {
      background: var(--orange); color: #000; font-weight: 600;
      box-shadow: 0 0 12px var(--orange-glow);
    }

    .show-closed-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent; color: var(--text-dim);
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .show-closed-toggle:hover { border-color: var(--border-mid); color: var(--text-secondary); }
    .show-closed-toggle.active { border-color: rgba(107,114,128,0.4); background: rgba(107,114,128,0.12); color: #9ca3af; }
    .show-closed-toggle .checkbox {
      width: 11px; height: 11px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.2);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1;
    }
    .show-closed-toggle.active .checkbox { background: #6B7280; border-color: #6B7280; color: #fff; }
    .show-closed-toggle .count { font-size: 9px; color: var(--text-dim); }
    .show-closed-toggle.active .count { color: rgba(255,255,255,0.5); }

    .action-btns { display: flex; gap: 6px; }
    .btn-reset {
      padding: 6px 14px; border-radius: 5px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.08em; cursor: pointer; transition: all 0.15s;
    }
    .btn-reset:hover { border-color: var(--border-mid); color: var(--text-secondary); }
    .btn-add {
      padding: 6px 18px; border-radius: 5px;
      border: 1px solid var(--orange-border);
      background: var(--orange-dim); color: var(--orange);
      font-family: var(--font-display); font-size: 14px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-add:hover { background: rgba(249,115,22,0.25); box-shadow: 0 0 16px var(--orange-glow); }

    /* ── COL HEADERS ── */
    .col-headers {
      display: grid;
      grid-template-columns: 40px 32px 160px 70px 100px 100px auto 1fr 28px 36px;
      gap: 12px; padding: 0 16px 7px;
      font-family: var(--font-mono); font-size: 9px;
      color: var(--text-dim); letter-spacing: 0.12em; text-transform: uppercase;
    }

    /* ── ACCOUNT ROWS ── */
    .accounts { display: flex; flex-direction: column; gap: 4px; }
    .account-row {
      display: grid;
      grid-template-columns: 40px 32px 160px 70px 100px 100px auto 1fr 28px 36px;
      align-items: center; gap: 12px;
      padding: 9px 16px;
      background: var(--panel);
      border-radius: 7px;
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      position: relative; overflow: hidden;
      transition: background 0.15s, border-color 0.15s;
    }
    /* Dot grid texture on rows */
    .account-row::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    /* Subtle right-side tint */
    .account-row::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 30%;
      pointer-events: none;
      background: linear-gradient(to left, var(--row-tint, transparent), transparent);
      border-radius: 0 6px 6px 0;
    }
    .account-row:hover { background: var(--panel-2); }

    .rank-badge {
      display: flex; align-items: center; justify-content: center;
      height: 24px; width: 36px; border-radius: 5px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      cursor: pointer; user-select: none; transition: all 0.15s;
      position: relative; z-index: 1;
    }
    .rank-badge.empty { color: var(--text-dim); }
    .rank-badge:hover { border-color: var(--orange-border); color: var(--orange); }
    .rank-input {
      width: 36px; height: 24px; padding: 0 4px;
      background: rgba(0,0,0,0.4); border: 1px solid var(--orange-border);
      border-radius: 5px; color: var(--orange);
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      text-align: center; outline: none; -moz-appearance: textfield;
      position: relative; z-index: 1;
    }
    .rank-input::-webkit-outer-spin-button,
    .rank-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .logo-wrap {
      width: 28px; height: 28px; border-radius: 6px;
      overflow: hidden; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; flex-shrink: 0;
      transition: border-color 0.15s; z-index: 1;
    }
    .logo-wrap:hover { border-color: var(--orange-border); }
    .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .logo-placeholder { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
    .logo-file-input { display: none; }

    .account-name-cell {
      display: flex; flex-direction: column; justify-content: center;
      align-self: stretch; gap: 3px; min-width: 0;
      position: relative; z-index: 1;
    }
    .stagnant-meta { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    .account-name {
      font-family: var(--font-display); font-size: 15px; font-weight: 600;
      letter-spacing: 0.02em; color: var(--text-primary); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .name-input {
      background: rgba(0,0,0,0.4); border: 1px solid var(--orange-border);
      border-radius: 4px; color: var(--text-primary);
      padding: 4px 8px; font-family: var(--font-display);
      font-size: 15px; font-weight: 600; outline: none; width: 100%;
    }

    .solution-tags { display: flex; gap: 4px; flex-wrap: wrap; position: relative; z-index: 1; }
    .sol-tag {
      padding: 2px 7px; border-radius: 3px;
      font-family: var(--font-mono); font-size: 9px; font-weight: 500;
      letter-spacing: 0.07em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s; border: 1px solid; user-select: none;
    }

    .manager-select, .stage-select {
      width: 100%; height: 26px; padding: 0 6px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border); border-left-width: 3px;
      border-radius: 5px; color: var(--text-secondary);
      font-family: var(--font-mono); font-size: 10px;
      outline: none; cursor: pointer; transition: border-color 0.15s;
      position: relative; z-index: 1;
    }
    .manager-select:hover, .stage-select:hover { border-color: var(--border-mid); }
    .manager-select option, .stage-select option { background: #1a1d24; color: var(--text-primary); }

    .lights { display: flex; gap: 5px; align-items: center; position: relative; z-index: 1; }
    .light {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.4); cursor: pointer;
      transition: all 0.2s ease; padding: 0;
    }
    .light:hover { border-color: rgba(255,255,255,0.2); }

    .note-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; z-index: 1; }
    .next-action-line {
      font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px;
    }
    .next-action-line.overdue { color: var(--c-critical); }
    .note-input {
      background: transparent; border: 1px solid transparent;
      border-radius: 4px; color: var(--text-primary);
      padding: 3px 8px; font-family: var(--font-body); font-size: 12px;
      outline: none; width: 100%; transition: border-color 0.2s;
    }
    .note-input:hover { border-color: var(--border); }
    .note-input:focus { border-color: var(--border-mid); background: rgba(0,0,0,0.2); }

    .details-btn {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: var(--text-secondary); cursor: pointer; font-size: 16px;
      width: 26px; height: 26px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; padding: 0; font-family: var(--font-mono);
      position: relative; z-index: 1;
    }
    .details-btn:hover { border-color: var(--orange-border); color: var(--orange); box-shadow: 0 0 8px var(--orange-glow); }
    .delete-btn {
      background: transparent; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 18px; padding: 4px; border-radius: 4px;
      line-height: 1; transition: color 0.2s; position: relative; z-index: 1;
    }
    .delete-btn:hover { color: #ef4444; }

    /* ── LEGEND ── */
    .legend {
      margin-top: 28px; padding: 14px 0;
      border-top: 1px solid var(--border);
      display: flex; gap: 18px; flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .empty { text-align: center; padding: 40px; color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; }

    /* ── SETTINGS ── */
    .settings-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(6px);
    }
    .settings-panel {
      background: var(--panel); border: 1px solid var(--border-mid);
      border-radius: 12px; padding: 28px; width: 90%; max-width: 520px;
      max-height: 85vh; overflow-y: auto;
      box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(249,115,22,0.06);
    }
    .settings-panel h2 {
      font-family: var(--font-display); font-size: 20px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px;
    }
    .settings-tabs {
      display: flex; gap: 2px; margin-bottom: 20px;
      border-bottom: 1px solid var(--border); overflow-x: auto;
    }
    .settings-tab {
      padding: 7px 13px; background: transparent; border: none;
      color: var(--text-secondary); font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.08em; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      white-space: nowrap; transition: all 0.15s;
    }
    .settings-tab:hover { color: var(--text-primary); }
    .settings-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
    .settings-section h3 {
      font-family: var(--font-display); font-size: 14px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px;
    }
    .settings-panel label {
      display: block; font-family: var(--font-mono); font-size: 10px;
      color: var(--text-secondary); letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 5px; margin-top: 14px;
    }
    .settings-panel label:first-of-type { margin-top: 0; }
    .settings-panel input[type="text"],
    .settings-panel input[type="password"],
    .settings-panel input[type="number"] {
      width: 100%; padding: 8px 12px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--border-mid);
      border-radius: 5px; color: var(--text-primary);
      font-family: var(--font-mono); font-size: 12px; outline: none;
    }
    .settings-panel input:focus { border-color: var(--orange-border); }
    .settings-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }
    .settings-hint a { color: var(--orange); text-decoration: none; }
    .settings-hint a:hover { text-decoration: underline; }
    .settings-buttons { display: flex; gap: 8px; margin-top: 24px; justify-content: flex-end; }
    .settings-error { color: #ef4444; font-size: 11px; margin-top: 10px; font-family: var(--font-mono); }

    .btn-primary {
      padding: 8px 20px; border-radius: 5px; border: none;
      background: var(--orange); color: #000;
      font-family: var(--font-display); font-size: 14px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer; box-shadow: 0 0 12px var(--orange-glow); transition: all 0.15s;
    }
    .btn-primary:hover { box-shadow: 0 0 20px var(--orange-glow); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary {
      padding: 8px 16px; border-radius: 5px;
      border: 1px solid var(--border-mid); background: transparent;
      color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px;
      cursor: pointer; transition: all 0.15s;
    }
    .btn-secondary:hover { color: var(--text-primary); }

    .config-item {
      display: grid; align-items: center; gap: 8px; padding: 8px;
      background: rgba(0,0,0,0.2); border: 1px solid var(--border);
      border-radius: 5px; margin-bottom: 5px;
    }
    .config-item.config-status   { grid-template-columns: 44px 32px 1fr 1.4fr 50px 32px; }
    .config-item.config-solution { grid-template-columns: 32px 1fr 50px 32px; }

    .config-item input[type="text"] {

    }

    .panel-input:focus, .panel-textarea:focus { border-color: var(--orange-border); }
    .panel-textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
    .timestamps {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
      padding: 12px; background: rgba(0,0,0,0.2);

    }
    .timestamps .ts { display: flex; flex-direction: column; gap: 4px; }
    .timestamps .ts-label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .timestamps .ts-value { font-family: var(--font-mono); font-size: 12px; color: var(--text-primary); }
    .timestamps .ts-value.muted { color: var(--text-dim); }
    .next-action-clear {
      background: transparent; border: none; color: var(--text-dim);
      font-family: var(--font-mono); font-size: 10px;
      cursor: pointer; align-self: flex-start; padding: 0; text-decoration: underline;
    }
    .next-action-clear:hover { color: #ef4444; }

    /* ── MOBILE ── */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .col-headers { display: none; }
      .account-row { grid-template-columns: 40px 32px 1fr 28px; gap: 8px; padding: 12px 14px; }
      .stage-select { grid-column: 1 / -1; }
      .manager-select { grid-column: 1 / -1; }
      .lights { grid-column: 1 / -1; }

      .next-action-row { grid-template-columns: 1fr; }
      .timestamps { grid-template-columns: 1fr; }
    }
  </style>

<body>
<div id="app"></div>
<script>
  const SYSTEM_STATUS_IDS = ["closed"];

  const GENERIC_STATUS_DEFAULTS = [
    { id:"critical",     label:"Critical",     color:"#ff4525", description:"Urgent — drop everything" },
    { id:"on_me",        label:"On Me",        color:"#F97316", description:"I need to act" },
    { id:"on_colleague", label:"On Colleague", color:"#a78bfa", description:"Waiting internally" },
    { id:"on_customer",  label:"On Customer",  color:"#38bdf8", description:"Waiting on them" },
    { id:"stalled",      label:"Stalled",      color:"#94a3b8", description:"Stuck / escalate" },
    { id:"cruising",     label:"Cruising",     color:"#86efac", description:"Active, no action needed" },
    { id:"closed",       label:"Closed",       color:"#6B7280", description:"Deal closed, archived" },
  ];
  const GENERIC_SOLUTION_DEFAULTS = [
    { id:"product_a", label:"Product A", color:"#38bdf8" },
    { id:"product_b", label:"Product B", color:"#a78bfa" },
    { id:"product_c", label:"Product C", color:"#F97316" },
  ];
  const GENERIC_STAGE_DEFAULTS = [
    { id:1, label:"1 — Prospect",      color:"#e8eaed", closing:false },
    { id:2, label:"2 — Qualification", color:"#38bdf8", closing:false },
    { id:3, label:"3 — Discovery",     color:"#2dd4bf", closing:false },
    { id:4, label:"4 — Proposal",      color:"#a3e635", closing:false },
    { id:5, label:"5 — Negotiation",   color:"#F97316", closing:false },
    { id:6, label:"6 — Closed - Won",  color:"#86efac", closing:true  },
    { id:7, label:"7 — Closed - Lost", color:"#ff4525", closing:true  },
    { id:8, label:"8 — Disqualified",  color:"#94a3b8", closing:true  },
  ];
  const GENERIC_MANAGER_DEFAULTS = [
    { id:"manager_a", label:"Manager A", color:"#38bdf8" },
    { id:"manager_b", label:"Manager B", color:"#F97316" },
    { id:"manager_c", label:"Manager C", color:"#86efac" },
  ];
  const LEGACY_STATUS_DEFAULTS = [
    { id:"critical",     label:"Critical",     color:"#FF0040", description:"Urgent — drop everything" },
    { id:"on_me",        label:"On Me",        color:"#F59E0B", description:"I need to act" },
    { id:"on_colleague", label:"On Colleague", color:"#8B5CF6", description:"Waiting internally" },
    { id:"on_customer",  label:"On Customer",  color:"#3B82F6", description:"Waiting on them" },
    { id:"stalled",      label:"Stalled",      color:"#FFFFFF", description:"Stuck / escalate" },
    { id:"cruising",     label:"Cruising",     color:"#10B981", description:"Active, no action needed" },
    { id:"closed",       label:"Closed",       color:"#6B7280", description:"Deal closed, archived" },
  ];
  const LEGACY_SOLUTION_DEFAULTS = [
    { id:"qms",    label:"QMS",    color:"#06B6D4" },
    { id:"evolve", label:"Evolve", color:"#A78BFA" },
    { id:"iforms", label:"iForms", color:"#FB923C" },
  ];
  const LEGACY_STAGE_DEFAULTS = [
    { id:1, label:"1 — Qualification", color:"#e8eaed", closing:false },
    { id:2, label:"2 — Validation",    color:"#0EA5E9", closing:false },
    { id:3, label:"3 — Design",        color:"#14B8A6", closing:false },
    { id:4, label:"4 — Negotiate",     color:"#84CC16", closing:false },
    { id:5, label:"5 — Procurement",   color:"#EAB308", closing:false },
    { id:6, label:"6 — Closed - Won",  color:"#F97316", closing:true  },
    { id:7, label:"7 — Closed - Lost", color:"#EC4899", closing:true  },
    { id:8, label:"8 — Disqualified",  color:"#10B981", closing:true  },
  ];

  const LS_CONFIG = "sb-config";

  function hasLegacyData() {
    try {
      const raw = localStorage.getItem("signal-board-accounts");
      if (!raw) return false;
      const accounts = JSON.parse(raw);
      const legacySolutionIds = new Set(["qms","evolve","iforms"]);
      return accounts.some(a => (a.solutions||[]).some(s => legacySolutionIds.has(s)));
    } catch { return false; }
  }

  function slugify(label, existingIds) {
    const base = (label||"item").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,30)||"item";
    if (!existingIds.includes(base)) return base;
    let i=2; while(existingIds.includes(`${base}_${i}`)) i++; return `${base}_${i}`;
  }
  function nextStageId(stages) { if(!stages.length) return 1; return Math.max(...stages.map(s=>s.id))+1; }

  function loadConfig() {
    try {
      const raw = localStorage.getItem(LS_CONFIG);
      if (raw) {
        const parsed = JSON.parse(raw);
        return {
          statuses:  parsed.statuses  || GENERIC_STATUS_DEFAULTS.map(s=>({...s})),
          solutions: parsed.solutions || GENERIC_SOLUTION_DEFAULTS.map(s=>({...s})),
          stages:    parsed.stages    || GENERIC_STAGE_DEFAULTS.map(s=>({...s})),
          managers:  parsed.managers  || GENERIC_MANAGER_DEFAULTS.map(s=>({...s})),
        };
      }
    } catch {}
    const useLegacy = hasLegacyData();
    const defaults = {
      statuses:  (useLegacy?LEGACY_STATUS_DEFAULTS:GENERIC_STATUS_DEFAULTS).map(s=>({...s})),
      solutions: (useLegacy?LEGACY_SOLUTION_DEFAULTS:GENERIC_SOLUTION_DEFAULTS).map(s=>({...s})),
      stages:    (useLegacy?LEGACY_STAGE_DEFAULTS:GENERIC_STAGE_DEFAULTS).map(s=>({...s})),
      managers:  GENERIC_MANAGER_DEFAULTS.map(s=>({...s})),
    };
    try { localStorage.setItem(LS_CONFIG, JSON.stringify(defaults)); } catch {}
    return defaults;
  }
  function saveConfig(cfg) { try { localStorage.setItem(LS_CONFIG, JSON.stringify(cfg)); } catch {} }

  let STATUSES=[],SOLUTIONS=[],SALES_STAGES=[],MANAGERS=[],STATUS_PRIORITY=[],CLOSING_STAGES=[];
  function syncConfigRefs() {
    STATUSES=state.config.statuses; SOLUTIONS=state.config.solutions;
    SALES_STAGES=state.config.stages; MANAGERS=state.config.managers||[];
    STATUS_PRIORITY=state.config.statuses.map(s=>s.id);
    CLOSING_STAGES=state.config.stages.filter(s=>s.closing).map(s=>s.id);
  }

  const DEFAULT_THRESHOLDS={critical:1,on_me:3,on_colleague:5,on_customer:10,stalled:7,cruising:30,closed:365};
  const NEW_STATUS_DEFAULT_THRESHOLD=7;
  const LS_THRESHOLDS="sb-thresholds";
  function loadThresholds() { try { const raw=localStorage.getItem(LS_THRESHOLDS); return raw?{...DEFAULT_THRESHOLDS,...JSON.parse(raw)}:{...DEFAULT_THRESHOLDS}; } catch { return {...DEFAULT_THRESHOLDS}; } }
  function saveThresholds(t) { localStorage.setItem(LS_THRESHOLDS,JSON.stringify(t)); }

  const LS_SHOW_CLOSED="sb-show-closed";
  function loadShowClosed() { return localStorage.getItem(LS_SHOW_CLOSED)==="true"; }
  function saveShowClosed(v) { localStorage.setItem(LS_SHOW_CLOSED,v?"true":"false"); }

  const SEED=[
    {id:"1",name:"Acme Corp",status:"on_me",note:"Send revised proposal by Friday",solutions:["qms"],stage:5,priority:1,logo:"",createdAt:Date.now(),nextActionDate:"",nextActionLabel:"",lastStatusChange:Date.now(),lastStageChange:Date.now(),lastTouched:Date.now()},
    {id:"2",name:"GlobalTech",status:"on_customer",note:"Waiting on signed SOW",solutions:["evolve","iforms"],stage:7,priority:1,logo:"",createdAt:Date.now(),nextActionDate:"",nextActionLabel:"",lastStatusChange:Date.now(),lastStageChange:Date.now(),lastTouched:Date.now()},
    {id:"3",name:"Pinnacle Inc",status:"cruising",note:"",solutions:["qms","evolve"],stage:3,priority:1,logo:"",createdAt:Date.now(),nextActionDate:"",nextActionLabel:"",lastStatusChange:Date.now(),lastStageChange:Date.now(),lastTouched:Date.now()},
  ];

  const LS_TOKEN="sb-github-token",LS_REPO="sb-github-repo",LS_USER="sb-github-user",DATA_FILE="data.json";
  let fileSha=null,saveTimer=null;

  function getGitHubConfig() { return {token:localStorage.getItem(LS_TOKEN)||"",repo:localStorage.getItem(LS_REPO)||"signal-board",user:localStorage.getItem(LS_USER)||""}; }
  function saveGitHubConfig(token,user,repo) { localStorage.setItem(LS_TOKEN,token);localStorage.setItem(LS_USER,user);localStorage.setItem(LS_REPO,repo); }
  function isConfigured() { const c=getGitHubConfig(); return c.token&&c.user&&c.repo; }

  async function githubLoad() {
    const {token,user,repo}=getGitHubConfig();
    try {
      const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github.v3+json"}});
      if(res.status===404){fileSha=null;return{__status:"missing"};}
      if(!res.ok) throw new Error(`GitHub API ${res.status}`);
      const json=await res.json(); fileSha=json.sha;
      let decoded;
      if(json.content&&json.content.length>0){
        decoded=atob(json.content.replace(/\n/g,""));
      } else if(json.sha){
        const blobRes=await fetch(`https://api.github.com/repos/${user}/${repo}/git/blobs/${json.sha}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github.v3+json"}});
        if(!blobRes.ok){const err=await blobRes.json().catch(()=>({}));throw new Error(`git blob API failed (${blobRes.status}): ${err.message||""}`);}
        const blob=await blobRes.json();
        if(!blob.content) return{__status:"corrupt",reason:"git blob API returned empty content."};
        decoded=atob(blob.content.replace(/\n/g,""));
      } else return{__status:"corrupt",reason:"Remote data file is empty."};
      const trimmed=decoded.trim();
      if(!trimmed) return{__status:"corrupt",reason:"Remote data file is empty."};
      let parsed; try{parsed=JSON.parse(trimmed);}catch{return{__status:"corrupt",reason:"Remote data file is not valid JSON."};}
      if(Array.isArray(parsed)) return{__status:"ok",accounts:parsed,config:null};
      if(parsed&&typeof parsed==="object") return{__status:"ok",accounts:parsed.accounts||[],config:parsed.config||null};
      return{__status:"corrupt",reason:"Remote data file has unexpected shape."};
    } catch(e){console.error("GitHub load error:",e);return{__status:"unreachable",reason:e.message};}
  }

  async function githubSave(accounts) {
    const {token,user,repo}=getGitHubConfig();
    const payload={accounts,config:state.config};
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(payload,null,2))));
    const doPut=async()=>{
      const body={message:"Update signal board data",content};
      if(fileSha) body.sha=fileSha;
      return fetch(`https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,{method:"PUT",headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},body:JSON.stringify(body)});
    };
    try {
      let res=await doPut();
      if(!res.ok){
        const errJson=await res.json().catch(()=>({})); const msg=errJson.message||"";
        const needsSha=res.status===422||/sha/i.test(msg);
        if(needsSha&&!fileSha){
          const headRes=await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${DATA_FILE}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github.v3+json"}});
          if(headRes.ok){const headJson=await headRes.json();fileSha=headJson.sha;res=await doPut();if(!res.ok){const e2=await res.json().catch(()=>({}));throw new Error(e2.message||`GitHub API ${res.status}`);}}
          else throw new Error(msg||`GitHub API ${res.status}`);
        } else throw new Error(msg||`GitHub API ${res.status}`);
      }
      const json=await res.json();fileSha=json.content.sha;return true;
    } catch(e){console.error("GitHub save error:",e);return false;}
  }

  function updateSyncIndicator() {
    const syncInfo={synced:{dot:"#10B981",text:"Synced"},saving:{dot:"#F97316",text:"Syncing..."},error:{dot:"#ef4444",text:"Sync error"},offline:{dot:"rgba(255,255,255,0.2)",text:"Local only"},unknown:{dot:"rgba(255,255,255,0.2)",text:"..."}}[state.syncStatus];
    const btn=document.getElementById("syncBtn"); if(!btn||!syncInfo) return;
    const dot=btn.querySelector(".sync-dot"); if(dot) dot.style.background=syncInfo.dot;
    const label=btn.querySelector(".sync-label"); if(label) label.textContent=syncInfo.text;
  }

  function debouncedGithubSave(accounts) {
    clearTimeout(saveTimer); state.syncStatus="saving"; updateSyncIndicator();

  const LS_ACCOUNTS="signal-board-accounts";

  }

  let state={
    accounts:localLoad()||SEED,

    editingId:null,editingRankId:null,showSettings:false,

    logoPopup:null,logoPreviewUrl:"",logoDomain:"",

  const MS_PER_DAY=24*60*60*1000;
  function relativeTime(ts){if(!ts)return"—";const diff=Date.now()-ts;if(diff<60000)return"just now";if(diff<3600000)return Math.floor(diff/60000)+"m ago";if(diff<MS_PER_DAY)return Math.floor(diff/3600000)+"h ago";const days=Math.floor(diff/MS_PER_DAY);if(days<30)return days+"d ago";const months=Math.floor(days/30);if(months<12)return months+"mo ago";return Math.floor(months/12)+"y ago";}
  function daysSince(ts){if(!ts)return null;return(Date.now()-ts)/MS_PER_DAY;}
  function formatActionDate(isoDate){if(!isoDate)return"";const d=new Date(isoDate+"T00:00:00");if(isNaN(d.getTime()))return isoDate;return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
  function isOverdue(isoDate){if(!isoDate)return false;return new Date(isoDate+"T23:59:59").getTime()<Date.now();}

  let bootComplete=false,remoteAccountCount=null;

  function persistAccounts() {
    localSave(state.accounts);

  async function initialLoad() {
    if(isConfigured()){
      state.syncStatus="saving";render();
      const remote=await githubLoad(); const status=remote?remote.__status:"unreachable";
      if(status==="ok"&&remote.accounts&&remote.accounts.length>0){
        state.accounts=migrateAll(remote.accounts);
        if(remote.config&&remote.config.statuses&&remote.config.solutions&&remote.config.stages){
          state.config=remote.config;
          if(!state.config.managers)state.config.managers=GENERIC_MANAGER_DEFAULTS.map(s=>({...s}));
          saveConfig(state.config);syncConfigRefs();
        }
        localSave(state.accounts);remoteAccountCount=state.accounts.length;state.syncStatus="synced";state.lastSync=new Date();
      } else if(status==="ok"&&(!remote.accounts||remote.accounts.length===0)){
        const local=localLoad(); state.accounts=(local&&local.length)?local:SEED; remoteAccountCount=0;state.syncStatus="synced";
      } else if(status==="missing"){
        const local=localLoad(); state.accounts=(local&&local.length)?local:SEED; remoteAccountCount=null;state.syncStatus="synced";
      } else if(status==="corrupt"){
        const local=localLoad(); state.accounts=(local&&local.length)?local:SEED;
        state.syncStatus="error";state.settingsError="Remote data is corrupt: "+(remote.reason||"unknown")+" Saves are blocked.";remoteAccountCount=Infinity;
      } else {
        const local=localLoad(); state.accounts=(local&&local.length)?local:SEED;
        state.syncStatus="error";state.settingsError="Couldn't reach GitHub: "+(remote&&remote.reason||"unknown")+". Showing local data.";remoteAccountCount=Infinity;
      }
    } else {state.accounts=localLoad()||SEED;state.syncStatus="offline";}
    state.loading=false;bootComplete=true;render();
  }

  function visibleAccounts(){if(state.showClosed)return state.accounts;if(state.filter==="closed")return state.accounts;return state.accounts.filter(a=>a.status!=="closed");}
  function getCounts(){const counts={};const base=visibleAccounts();STATUSES.forEach(s=>{counts[s.id]=s.id==="closed"?state.accounts.filter(a=>a.status===s.id).length:base.filter(a=>a.status===s.id).length;});return counts;}
  function getSolCounts(){const base=visibleAccounts();return SOLUTIONS.reduce((acc,s)=>{acc[s.id]=base.filter(a=>(a.solutions||[]).includes(s.id)).length;return acc;},{});}
  function getStageCounts(){const base=visibleAccounts();return SALES_STAGES.reduce((acc,s)=>{acc[s.id]=base.filter(a=>a.stage===s.id).length;return acc;},{});}
  function getFiltered(){let list=visibleAccounts();if(state.filter!=="all")list=list.filter(a=>a.status===state.filter);if(state.solutionFilter!=="all")list=list.filter(a=>(a.solutions||[]).includes(state.solutionFilter));if(state.stageFilter!=="all")list=list.filter(a=>a.stage===state.stageFilter);return list;}
  function getSorted(filtered){return[...filtered].sort((a,b)=>{if(state.sortBy==="status"){const ai=STATUS_PRIORITY.indexOf(a.status),bi=STATUS_PRIORITY.indexOf(b.status);const statusDiff=(ai===-1?99:ai)-(bi===-1?99:bi);if(statusDiff!==0)return statusDiff;return(a.priority??Infinity)-(b.priority??Infinity);}if(state.sortBy==="alpha")return a.name.localeCompare(b.name);return b.createdAt-a.createdAt;});}
  function getStagnantAccounts(){const list=state.accounts.filter(a=>{if(!a.status||a.status==="closed")return false;const threshold=state.thresholds[a.status];if(!threshold||threshold<=0)return false;const days=daysSince(a.lastTouched);return days!==null&&days>=threshold;});list.sort((a,b)=>{const aOver=daysSince(a.lastTouched)-state.thresholds[a.status],bOver=daysSince(b.lastTouched)-state.thresholds[b.status];return bOver-aOver;});return list;}

  function touch(acct){if(!acct)return;acct.lastTouched=Date.now();}
  function normalizeGroup(statusId){if(!statusId)return;const group=state.accounts.filter(a=>a.status===statusId);group.sort((a,b)=>(a.priority??Infinity)-(b.priority??Infinity));group.forEach((acct,i)=>{acct.priority=i+1;});}
  function setPriority(id,targetRank){const acct=state.accounts.find(a=>a.id===id);if(!acct||!acct.status)return;const target=parseInt(targetRank,10);if(isNaN(target)||target<1)return;normalizeGroup(acct.status);const group=state.accounts.filter(a=>a.status===acct.status);const clamped=Math.min(target,group.length);acct.priority=0;const others=group.filter(a=>a.id!==acct.id).sort((a,b)=>a.priority-b.priority);let rank=1;others.forEach(other=>{if(rank===clamped)rank++;other.priority=rank++;});acct.priority=clamped;touch(acct);update({});}
  function assignRankToBottom(acct){if(!acct.status){acct.priority=null;return;}const group=state.accounts.filter(a=>a.status===acct.status&&a.id!==acct.id);acct.priority=group.length+1;}
  function addAccount(){const now=Date.now();state.accounts.unshift({id:now.toString(),name:"New Account",status:null,note:"",solutions:[],stage:null,manager:null,priority:null,logo:"",createdAt:now,nextActionDate:"",nextActionLabel:"",lastStatusChange:now,lastStageChange:now,lastTouched:now});state.editingId=state.accounts[0].id;update({});}
  function deleteAccount(id){const acct=state.accounts.find(a=>a.id===id);const oldStatus=acct?.status;state.accounts=state.accounts.filter(a=>a.id!==id);if(oldStatus)normalizeGroup(oldStatus);if(state.detailPanelId===id)state.detailPanelId=null;update({});}
  function setStatus(id,statusId){const acct=state.accounts.find(a=>a.id===id);if(!acct)return;const oldStatus=acct.status;const newStatus=acct.status===statusId?null:statusId;acct.status=newStatus;if(oldStatus&&oldStatus!==newStatus){acct.priority=null;normalizeGroup(oldStatus);}if(newStatus&&newStatus!==oldStatus)assignRankToBottom(acct);if(!newStatus)acct.priority=null;if(oldStatus!==newStatus){acct.lastStatusChange=Date.now();touch(acct);}update({});}
  function setStage(id,stageId){const acct=state.accounts.find(a=>a.id===id);if(!acct)return;const newStage=(stageId===""||stageId===null)?null:parseInt(stageId,10);if(acct.stage!==newStage){const wasClosing=CLOSING_STAGES.includes(acct.stage);const isClosing=CLOSING_STAGES.includes(newStage);acct.stage=newStage;acct.lastStageChange=Date.now();touch(acct);if(isClosing&&!wasClosing&&acct.status!=="closed"){const oldStatus=acct.status;acct.status="closed";acct.lastStatusChange=Date.now();if(oldStatus){acct.priority=null;normalizeGroup(oldStatus);}assignRankToBottom(acct);}}update({});}
  function toggleSolution(id,solId){const acct=state.accounts.find(a=>a.id===id);if(!acct)return;if(!acct.solutions)acct.solutions=[];const idx=acct.solutions.indexOf(solId);if(idx>=0)acct.solutions.splice(idx,1);else acct.solutions.push(solId);update({});}
  function setManager(id,managerId){const acct=state.accounts.find(a=>a.id===id);if(!acct)return;acct.manager=(managerId===""||managerId===null)?null:managerId;update({});}

  async function testAndSaveConfig(token,user,repo){
    try{
      const res=await fetch(`https://api.github.com/repos/${user}/${repo}`,{headers:{Authorization:`Bearer ${token}`,Accept:"application/vnd.github.v3+json"}});
      if(res.status===401)return"Invalid token.";if(res.status===404)return`Repo "${user}/${repo}" not found.`;if(!res.ok)return`GitHub returned an error (${res.status}).`;
      saveGitHubConfig(token,user,repo);state.settingsError="";render();
      const remote=await githubLoad();const status=remote?remote.__status:"unreachable";
      if(status==="ok"&&remote.accounts&&remote.accounts.length>0){
        state.accounts=migrateAll(remote.accounts);
        if(remote.config&&remote.config.statuses&&remote.config.solutions&&remote.config.stages){state.config=remote.config;if(!state.config.managers)state.config.managers=GENERIC_MANAGER_DEFAULTS.map(s=>({...s}));saveConfig(state.config);syncConfigRefs();}
        localSave(state.accounts);remoteAccountCount=state.accounts.length;state.syncStatus="synced";state.lastSync=new Date();
      } else if(status==="ok"||status==="missing"){
        await githubSave(state.accounts);remoteAccountCount=state.accounts.length;state.syncStatus="synced";state.lastSync=new Date();
      } else {state.syncStatus="error";state.settingsError="Connected, but remote data has a problem: "+(remote&&remote.reason||"unknown")+". Saves are blocked.";remoteAccountCount=Infinity;}
      render();return null;
    }catch(e){return"Network error. Check your connection.";}
  }

  function addStatus(){const existingIds=state.config.statuses.map(s=>s.id);const newId=slugify("new_status",existingIds);state.config.statuses.push({id:newId,label:"New Status",color:"#94A3B8",description:""});const closedIdx=state.config.statuses.findIndex(s=>s.id==="closed");if(closedIdx!==-1&&closedIdx!==state.config.statuses.length-1){const added=state.config.statuses.pop();state.config.statuses.splice(closedIdx,0,added);}state.thresholds[newId]=NEW_STATUS_DEFAULT_THRESHOLD;saveThresholds(state.thresholds);commitConfig();render();}

  function addSolution(){const existingIds=state.config.solutions.map(s=>s.id);const newId=slugify("new_solution",existingIds);state.config.solutions.push({id:newId,label:"New Solution",color:"#94A3B8"});commitConfig();render();}

      const thresholdsSection=`<p class="config-help">Accounts flagged stagnant when nothing touched within these limits.</p>${STATUSES.map(s=>`<div class="threshold-row"><span class="dot" style="background:${s.color}"></span><span class="label">${s.label}</span><input type="number" id="threshold-${s.id}" min="1" max="365" value="${state.thresholds[s.id]??DEFAULT_THRESHOLDS[s.id]??NEW_STATUS_DEFAULT_THRESHOLD}" /><span class="unit">days</span></div>`).join("")}<div style="margin-top:12px"><button class="btn-secondary" id="resetThresholdsBtn">Reset to defaults</button></div>`;
      const statusesSection=`<p class="config-help">Statuses describe where each account stands.</p><div class="config-list-header for-status"><div></div><div></div><div>Label</div><div>Description</div><div>Used</div><div></div></div>${state.config.statuses.map((s,i)=>{const usage=countUsage("status",s.id);const isSystem=SYSTEM_STATUS_IDS.includes(s.id);return`<div class="config-item config-status ${isSystem?"system-item":""}"><div class="reorder-btns"><button class="reorder-btn" data-status-move="${s.id}:-1" ${i===0?"disabled":""}>▲</button><button class="reorder-btn" data-status-move="${s.id}:1" ${i===state.config.statuses.length-1?"disabled":""}>▼</button></div><input type="color" data-status-color="${s.id}" value="${s.color}" /><input type="text" data-status-label="${s.id}" value="${(s.label||"").replace(/"/g,"&quot;")}" /><input type="text" data-status-desc="${s.id}" value="${(s.description||"").replace(/"/g,"&quot;")}" /><span class="usage-count ${usage>0?"in-use":""}">${usage}</span><button class="delete-config-btn" data-status-delete="${s.id}" ${isSystem?"disabled":""}>×</button></div>`;}).join("")}<button class="config-add-btn" id="addStatusBtn">+ Add status</button>`;
      const solutionsSection=`<p class="config-help">Solutions are tags per account (e.g. product lines).</p><div class="config-list-header for-solution"><div></div><div>Label</div><div>Used</div><div></div></div>${state.config.solutions.map(s=>{const usage=countUsage("solution",s.id);return`<div class="config-item config-solution"><input type="color" data-sol-color="${s.id}" value="${s.color}" /><input type="text" data-sol-label="${s.id}" value="${(s.label||"").replace(/"/g,"&quot;")}" /><span class="usage-count ${usage>0?"in-use":""}">${usage}</span><button class="delete-config-btn" data-sol-delete="${s.id}">×</button></div>`;}).join("")}<button class="config-add-btn" id="addSolutionBtn">+ Add solution</button>`;
      const managersList=state.config.managers||[];
      const managersSection=`<p class="config-help">Account managers own opportunities.</p><div class="config-list-header for-manager"><div></div><div>Label</div><div>Used</div><div></div></div>${managersList.map(m=>{const usage=countUsage("manager",m.id);return`<div class="config-item config-manager"><input type="color" data-mgr-color="${m.id}" value="${m.color}" /><input type="text" data-mgr-label="${m.id}" value="${(m.label||"").replace(/"/g,"&quot;")}" /><span class="usage-count ${usage>0?"in-use":""}">${usage}</span><button class="delete-config-btn" data-mgr-delete="${m.id}">×</button></div>`;}).join("")}<button class="config-add-btn" id="addManagerBtn">+ Add manager</button>`;
      const stagesSection=`<p class="config-help">Stages represent your pipeline. "Closing" stages auto-mark accounts as Closed.</p><div class="config-list-header for-stage"><div></div><div></div><div>Label</div><div>Closing</div><div>Used</div><div></div></div>${state.config.stages.map((s,i)=>{const usage=countUsage("stage",s.id);return`<div class="config-item config-stage"><div class="reorder-btns"><button class="reorder-btn" data-stage-move="${s.id}:-1" ${i===0?"disabled":""}>▲</button><button class="reorder-btn" data-stage-move="${s.id}:1" ${i===state.config.stages.length-1?"disabled":""}>▼</button></div><input type="color" data-stage-color="${s.id}" value="${s.color}" /><input type="text" data-stage-label="${s.id}" value="${(s.label||"").replace(/"/g,"&quot;")}" /><div class="closing-toggle"><input type="checkbox" data-stage-closing="${s.id}" ${s.closing?"checked":""} /></div><span class="usage-count ${usage>0?"in-use":""}">${usage}</span><button class="delete-config-btn" data-stage-delete="${s.id}">×</button></div>`;}).join("")}<button class="config-add-btn" id="addStageBtn">+ Add stage</button>`;
      const sections={sync:{title:"Cross-Device Sync",body:syncSection},thresholds:{title:"Stagnant Thresholds",body:thresholdsSection},statuses:{title:"Statuses",body:statusesSection},solutions:{title:"Solutions",body:solutionsSection},managers:{title:"Account Managers",body:managersSection},stages:{title:"Stages",body:stagesSection}};
      const current=sections[tab]||sections.sync;
      html+=`<div class="settings-overlay" id="settingsOverlay"><div class="settings-panel"><h2>Settings</h2><div class="settings-tabs">${["sync","thresholds","statuses","solutions","managers","stages"].map(t=>`<button class="settings-tab ${tab===t?"active":""}" data-tab="${t}">${t.toUpperCase()}</button>`).join("")}</div><div class="settings-section"><h3>${current.title}</h3>${current.body}</div><div class="settings-buttons"><button class="btn-primary" id="settingsClose">Done</button></div></div></div>`;
      if(state.configBlockMessage)html+=`<div class="config-block-overlay" id="configBlockOverlay"><div class="config-block-inner"><h4>Can't delete</h4><p>${state.configBlockMessage}</p><div style="display:flex;justify-content:flex-end"><button class="btn-primary" id="configBlockOk">OK</button></div></div></div>`;
    }

    if(state.detailPanelId){
      const acct=state.accounts.find(a=>a.id===state.detailPanelId);
      if(acct){
        const active=STATUSES.find(s=>s.id===acct.status);
        const stageRec=acct.stage?SALES_STAGES.find(s=>s.id===acct.stage):null;
        const overdue=isOverdue(acct.nextActionDate);
        html+=`<div class="side-panel-backdrop open" id="panelBackdrop"></div>
          <div class="side-panel open">
            <div class="side-panel-header">
              <div class="logo-mini">${acct.logo?`<img src="${acct.logo}" onerror="this.style.display='none'" />`:`<span style="font-size:14px;color:var(--orange);font-family:var(--font-display);font-weight:700">${acct.name.charAt(0).toUpperCase()}</span>`}</div>
              <h2>${acct.name}</h2>
              <button class="side-panel-close" id="panelCloseBtn">×</button>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10px">
              ${active?`<span style="color:${active.color};border:1px solid ${active.color}44;padding:3px 10px;border-radius:3px;background:${active.color}11">${active.label}</span>`:`<span style="color:var(--text-dim);border:1px solid var(--border);padding:3px 10px;border-radius:3px">No status</span>`}
              ${stageRec?`<span style="color:${stageRec.color};border:1px solid ${stageRec.color}44;padding:3px 10px;border-radius:3px;background:${stageRec.color}11">${stageRec.label}</span>`:""}
              ${acct.priority?`<span style="color:var(--orange);border:1px solid var(--orange-border);padding:3px 10px;border-radius:3px;background:var(--orange-dim)">Rank #${acct.priority}</span>`:""}
            </div>
            <div class="panel-section">
              <span class="panel-label">Next Action</span>
              <div class="next-action-row">
                <input type="date" class="panel-input" id="panelActionDate" value="${acct.nextActionDate||""}" />
                <input type="text" class="panel-input" id="panelActionLabel" value="${(acct.nextActionLabel||"").replace(/"/g,"&quot;")}" placeholder="e.g. send revised quote" />
              </div>
              ${(acct.nextActionDate||acct.nextActionLabel)?`<button class="next-action-clear" id="panelActionClear">Clear next action</button>`:""}
              ${overdue?`<div style="font-size:10px;color:var(--c-critical);font-family:var(--font-mono)">⚠ Overdue</div>`:""}
            </div>
            <div class="panel-section">
              <span class="panel-label">Notes</span>
              <textarea class="panel-textarea" id="panelNote" placeholder="Add context, history, anything useful…">${acct.note||""}</textarea>
              <div style="font-size:10px;color:var(--text-dim);font-family:var(--font-mono)">First line shows on the board.</div>
            </div>
            <div class="panel-section">
              <span class="panel-label">Activity</span>
              <div class="timestamps">
                <div class="ts"><span class="ts-label">Last status</span><span class="ts-value ${acct.lastStatusChange?"":"muted"}">${relativeTime(acct.lastStatusChange)}</span></div>
                <div class="ts"><span class="ts-label">Last stage</span><span class="ts-value ${acct.lastStageChange?"":"muted"}">${relativeTime(acct.lastStageChange)}</span></div>
                <div class="ts"><span class="ts-label">Last touched</span><span class="ts-value ${acct.lastTouched?"":"muted"}">${relativeTime(acct.lastTouched)}</span></div>
              </div>
            </div>
          </div>`;
      }
    }

    if(state.loading){html+=`<div class="empty" style="padding:80px">Loading...</div>`;}
    else{
      const criticalCount=counts["critical"]||0,onMeCount=counts["on_me"]||0;
      const activeCount=visibleAccounts().filter(a=>a.status&&a.status!=="closed").length;
      html+=`
        <div class="header">
          <div class="header-top">
            <div class="header-brand">
              <div class="brand-icon">
                <svg viewBox="0 0 16 16" fill="none"><rect x="1" y="8" width="3" height="7" rx="1.5" fill="white"/><rect x="6.5" y="4.5" width="3" height="10.5" rx="1.5" fill="white"/><rect x="12" y="1" width="3" height="14" rx="1.5" fill="white"/></svg>
              </div>
              <div class="brand-name">Signal<span>Board</span></div>
            </div>
            <div class="header-stats">
              <div class="stat-block"><div class="stat-val">${state.accounts.length}</div><div class="stat-lbl">Accounts</div></div>
              <div class="stat-block"><div class="stat-val">${activeCount}</div><div class="stat-lbl">Active</div></div>
              ${criticalCount>0?`<div class="stat-block"><div class="stat-val orange">${criticalCount}</div><div class="stat-lbl">Critical</div></div>`:""}
              ${onMeCount>0?`<div class="stat-block"><div class="stat-val" style="color:var(--orange)">${onMeCount}</div><div class="stat-lbl">On Me</div></div>`:""}
            </div>
            <button class="sync-status" id="syncBtn">
              <span class="sync-dot" style="background:${syncInfo.dot};box-shadow:0 0 6px ${syncInfo.dot}88"></span>
              <span class="sync-label">${syncInfo.text}</span>
            </button>
          </div>
          <div class="filters">
            <button class="filter-pill ${state.filter==="all"?"active-pill":""}" data-filter="all" style="${state.filter==="all"?"border-color:var(--orange-border);background:var(--orange-dim);color:var(--orange);":""}">All ${state.accounts.length}</button>
            ${STATUSES.map(s=>`<button class="filter-pill" data-filter="${s.id}" style="${state.filter===s.id?`border-color:${s.color}55;background:${s.color}11;color:${s.color};`:`color:${counts[s.id]>0?s.color:"var(--text-dim)"};`}"><span class="filter-dot" style="background:${counts[s.id]>0?s.color:"rgba(255,255,255,0.1)"}"></span>${s.label.toUpperCase()} ${counts[s.id]}</button>`).join("")}
            <div class="filter-sep"></div>
            ${SOLUTIONS.map(s=>`<button class="filter-pill" data-sol-filter="${s.id}" style="${state.solutionFilter===s.id?`border-color:${s.color}55;background:${s.color}11;color:${s.color};`:`color:${solCounts[s.id]>0?s.color:"var(--text-dim)"};`}"><span class="filter-dot" style="background:${solCounts[s.id]>0?s.color:"rgba(255,255,255,0.1)"}"></span>${s.label.toUpperCase()} ${solCounts[s.id]}</button>`).join("")}
            <div class="filter-sep"></div>
            ${SALES_STAGES.map(s=>`<button class="filter-pill" data-stage-filter="${s.id}" title="${s.label}" style="${state.stageFilter===s.id?`border-color:${s.color}55;background:${s.color}11;color:${s.color};`:`color:${stageCounts[s.id]>0?s.color:"var(--text-dim)"};`}"><span class="filter-dot" style="background:${stageCounts[s.id]>0?s.color:"rgba(255,255,255,0.1)"}"></span>S${s.id} ${stageCounts[s.id]}</button>`).join("")}
          </div>
        </div>

        ${stagnant.length>0?`
          <div class="stagnant-section">
            <div class="stagnant-header ${state.stagnantCollapsed?"collapsed":""}" id="stagnantHeader">
              <div class="s-icon">!</div>
              <span class="title">Needs Attention</span>
              <span class="count-badge">${stagnant.length}</span>
              <span class="caret">▾</span>
            </div>
            <div class="stagnant-body ${state.stagnantCollapsed?"collapsed":""}">
              ${stagnant.map(acct=>renderAccountRow(acct,true)).join("")}
            </div>
          </div>`:""}

        <div class="toolbar">
          <div class="sort-btns">
            ${[{key:"status",label:"By Priority"},{key:"alpha",label:"A–Z"},{key:"newest",label:"Newest"}].map(o=>`<button class="sort-btn ${state.sortBy===o.key?"active":""}" data-sort="${o.key}">${o.label}</button>`).join("")}
          </div>
          <button class="show-closed-toggle ${state.showClosed?"active":""}" id="showClosedToggle">
            <span class="checkbox">${state.showClosed?"✓":""}</span>
            <span>SHOW CLOSED</span>
            <span class="count">${state.accounts.filter(a=>a.status==="closed").length}</span>
          </button>
          <div class="action-btns">
            <button class="btn-reset" id="resetBtn">RESET</button>
            <button class="btn-add" id="addBtn">+ ADD ACCOUNT</button>
          </div>
        </div>

        <div class="col-headers">
          <div>Rank</div><div></div><div>Account</div><div>Solutions</div><div>Manager</div><div>Stage</div><div>Status</div><div>Note</div><div></div><div></div>
        </div>

        <div class="accounts">
          ${sorted.length===0?`<div class="empty">${state.filter==="all"&&state.solutionFilter==="all"&&state.stageFilter==="all"?"No accounts yet. Click + ADD ACCOUNT to get started.":"No accounts match these filters."}</div>`:sorted.map(acct=>renderAccountRow(acct,false)).join("")}
        </div>

        <div class="legend">
          ${STATUSES.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color};box-shadow:0 0 5px ${s.color}66"></span>${s.label} — ${s.description}</div>`).join("")}
        </div>`;
    }

    app.innerHTML=html;
    attachEventListeners();
  }

  function renderAccountRow(acct, inStagnantSection) {
    const active=STATUSES.find(s=>s.id===acct.status);
    const borderColor=active?active.color:"rgba(255,255,255,0.08)";
    const rowTint=active?`${active.color}0a`:"transparent";
    const isEditing=state.editingId===acct.id;
    const isEditingRank=state.editingRankId===acct.id;
    const sols=acct.solutions||[];
    const stageRec=acct.stage?SALES_STAGES.find(s=>s.id===acct.stage):null;
    const managerRec=acct.manager?MANAGERS.find(m=>m.id===acct.manager):null;

    let stagnantMeta="";
    if(inStagnantSection&&acct.status){
      const days=Math.floor(daysSince(acct.lastTouched));
      stagnantMeta=`<div class="stagnant-meta"><span class="stagnant-badge">${days}d</span><button class="stagnant-reset" data-stagnant-reset="${acct.id}">RESET</button></div>`;
    }

    let nextActionLine="";
    if(acct.nextActionDate||acct.nextActionLabel){
      const overdue=isOverdue(acct.nextActionDate);
      const datePart=acct.nextActionDate?formatActionDate(acct.nextActionDate):"";
      const labelPart=acct.nextActionLabel||"";
      const joined=[datePart,labelPart].filter(Boolean).join(" · ");
      nextActionLine=`<div class="next-action-line ${overdue?"overdue":""}" title="Next action${overdue?" (overdue)":""}">→ ${joined}</div>`;
    }

    const noteFirstLine=(acct.note||"").split("\n")[0];

    return `<div class="account-row" data-account-id="${acct.id}" style="border-left-color:${borderColor};--row-tint:${rowTint}">
      ${isEditingRank?`<input class="rank-input" type="number" min="1" data-rank-input="${acct.id}" value="${acct.priority||""}" />`:`<div class="rank-badge ${acct.priority?"":"empty"}" data-edit-rank="${acct.id}">${acct.priority?"#"+acct.priority:"—"}</div>`}
      <div class="logo-wrap" data-logo="${acct.id}" title="Click to set logo">
        ${acct.logo?`<img src="${acct.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" /><span class="logo-placeholder" style="display:none">+</span>`:`<span class="logo-placeholder">+</span>`}
      </div>
      ${isEditing?`<input class="name-input" data-name-input="${acct.id}" value="${acct.name.replace(/"/g,"&quot;")}" />`:`<div class="account-name-cell">${stagnantMeta}<div class="account-name" data-edit-name="${acct.id}">${acct.name}</div></div>`}
      <div class="solution-tags">
        ${SOLUTIONS.map(s=>{const on=sols.includes(s.id);return`<span class="sol-tag" data-sol="${acct.id}:${s.id}" style="background:${on?s.color+"18":"transparent"};color:${on?s.color:"var(--text-dim)"};border-color:${on?s.color+"55":"rgba(255,255,255,0.07)"}">${s.label}</span>`;}).join("")}
      </div>
      <select class="manager-select" data-manager="${acct.id}" style="border-left-color:${managerRec?managerRec.color:"rgba(255,255,255,0.08)"};color:${managerRec?managerRec.color:"var(--text-dim)"}">
        <option value="" ${!acct.manager?"selected":""}>— Manager —</option>
        ${MANAGERS.map(m=>`<option value="${m.id}" ${acct.manager===m.id?"selected":""}>${m.label}</option>`).join("")}
      </select>
      <select class="stage-select" data-stage="${acct.id}" style="border-left-color:${stageRec?stageRec.color:"rgba(255,255,255,0.08)"};color:${stageRec?stageRec.color:"var(--text-dim)"}">
        <option value="" ${!acct.stage?"selected":""}>— Stage —</option>
        ${SALES_STAGES.map(s=>`<option value="${s.id}" ${acct.stage===s.id?"selected":""}>${s.label}</option>`).join("")}
      </select>
      <div class="lights">
        ${STATUSES.map(s=>{const on=acct.status===s.id;return`<button class="light" data-light="${acct.id}:${s.id}" title="${s.label}: ${s.description}" style="border-color:${on?s.color:"rgba(255,255,255,0.08)"};background:${on?`radial-gradient(circle at 40% 35%, rgba(255,255,255,0.35) 0%, transparent 60%), ${s.color}`:"rgba(0,0,0,0.4)"};box-shadow:${on?`0 0 10px ${s.color}99, 0 0 22px ${s.color}44`:"none"}"></button>`;}).join("")}
      </div>
      <div class="note-cell">
        ${nextActionLine}
        <input class="note-input" data-note="${acct.id}" value="${(noteFirstLine||"").replace(/"/g,"&quot;")}" placeholder="Quick note..." />
      </div>
      <button class="details-btn" data-details="${acct.id}" title="Open details">›</button>
      <button class="delete-btn" data-delete="${acct.id}">&times;</button>
    </div>`;
  }

  function attachEventListeners() {
    const app=document.getElementById("app");
    app.querySelectorAll("[data-logo]").forEach(el=>el.addEventListener("click",()=>openLogoPopup(el.dataset.logo)));
    const logoOverlay=document.getElementById("logoOverlay"); if(logoOverlay)logoOverlay.addEventListener("click",e=>{if(e.target===logoOverlay)closeLogoPopup();});
    const logoCancelBtn=document.getElementById("logoCancelBtn"); if(logoCancelBtn)logoCancelBtn.addEventListener("click",closeLogoPopup);
    const logoDomainInput=document.getElementById("logoDomainInput");
    if(logoDomainInput){
      const updatePreview=()=>{const url=logoUrlFromDomain(logoDomainInput.value);state.logoDomain=logoDomainInput.value;state.logoPreviewUrl=url;const area=document.getElementById("logoPreviewArea");if(area&&url){area.innerHTML=`<img src="${url}" onerror="this.style.display='none'" style="width:40px;height:40px;border-radius:6px;object-fit:contain" /><span style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">Preview</span>`;const saveBtn=document.getElementById("logoSaveBtn");if(saveBtn)saveBtn.disabled=false;}};
      logoDomainInput.addEventListener("input",updatePreview);logoDomainInput.addEventListener("keydown",e=>{if(e.key==="Enter")updatePreview();});logoDomainInput.focus();
    }
    const logoSaveBtn=document.getElementById("logoSaveBtn"); if(logoSaveBtn)logoSaveBtn.addEventListener("click",()=>saveLogo(state.logoPopup,state.logoPreviewUrl));
    const logoRemoveBtn=document.getElementById("logoRemoveBtn"); if(logoRemoveBtn)logoRemoveBtn.addEventListener("click",()=>removeLogo(state.logoPopup));
    const logoFileInput=document.getElementById("logoFileInput"); if(logoFileInput)logoFileInput.addEventListener("change",e=>{if(e.target.files[0])handleLogoUpload(state.logoPopup,e.target.files[0]);});
    const syncBtn=document.getElementById("syncBtn"); if(syncBtn)syncBtn.addEventListener("click",()=>{state.showSettings=true;state.settingsError="";render();});
    const settingsClose=document.getElementById("settingsClose"); if(settingsClose)settingsClose.addEventListener("click",()=>{saveThresholdsFromInputs();state.showSettings=false;render();});
    const resetThresholdsBtn=document.getElementById("resetThresholdsBtn"); if(resetThresholdsBtn)resetThresholdsBtn.addEventListener("click",resetThresholdsToDefaults);
    const disconnectBtn=document.getElementById("disconnectBtn"); if(disconnectBtn)disconnectBtn.addEventListener("click",disconnectGitHub);
    const overlay=document.getElementById("settingsOverlay"); if(overlay)overlay.addEventListener("click",e=>{if(e.target===overlay){saveThresholdsFromInputs();state.showSettings=false;render();}});
    const settingsSave=document.getElementById("settingsSave"); if(settingsSave)settingsSave.addEventListener("click",async()=>{const token=document.getElementById("inputToken").value.trim(),user=document.getElementById("inputUser").value.trim(),repo=document.getElementById("inputRepo").value.trim();if(!token||!user||!repo){state.settingsError="All fields are required.";render();return;}settingsSave.disabled=true;settingsSave.textContent="Testing...";const err=await testAndSaveConfig(token,user,repo);if(err){state.settingsError=err;render();}});
    app.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",()=>{saveThresholdsFromInputs();state.settingsTab=btn.dataset.tab;render();}));
    app.querySelectorAll("[data-status-color]").forEach(input=>input.addEventListener("change",()=>updateStatus(input.dataset.statusColor,{color:input.value})));
    app.querySelectorAll("[data-status-label]").forEach(input=>{input.addEventListener("blur",()=>updateStatus(input.dataset.statusLabel,{label:input.value}));input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-status-desc]").forEach(input=>{input.addEventListener("blur",()=>updateStatus(input.dataset.statusDesc,{description:input.value}));input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-status-move]").forEach(btn=>btn.addEventListener("click",()=>{const[id,dir]=btn.dataset.statusMove.split(":");moveStatus(id,parseInt(dir,10));}));
    app.querySelectorAll("[data-status-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteStatus(btn.dataset.statusDelete)));
    const addStatusBtn=document.getElementById("addStatusBtn"); if(addStatusBtn)addStatusBtn.addEventListener("click",addStatus);
    app.querySelectorAll("[data-sol-color]").forEach(input=>input.addEventListener("change",()=>updateSolution(input.dataset.solColor,{color:input.value})));
    app.querySelectorAll("[data-sol-label]").forEach(input=>{input.addEventListener("blur",()=>updateSolution(input.dataset.solLabel,{label:input.value}));input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-sol-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteSolution(btn.dataset.solDelete)));
    const addSolutionBtn=document.getElementById("addSolutionBtn"); if(addSolutionBtn)addSolutionBtn.addEventListener("click",addSolution);
    app.querySelectorAll("[data-mgr-color]").forEach(input=>input.addEventListener("change",()=>updateManager(input.dataset.mgrColor,{color:input.value})));
    app.querySelectorAll("[data-mgr-label]").forEach(input=>{input.addEventListener("blur",()=>updateManager(input.dataset.mgrLabel,{label:input.value}));input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-mgr-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteManager(btn.dataset.mgrDelete)));
    const addManagerBtn=document.getElementById("addManagerBtn"); if(addManagerBtn)addManagerBtn.addEventListener("click",addManager);
    app.querySelectorAll("[data-stage-color]").forEach(input=>input.addEventListener("change",()=>updateStage(parseInt(input.dataset.stageColor,10),{color:input.value})));
    app.querySelectorAll("[data-stage-label]").forEach(input=>{input.addEventListener("blur",()=>updateStage(parseInt(input.dataset.stageLabel,10),{label:input.value}));input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-stage-closing]").forEach(input=>input.addEventListener("change",()=>updateStage(parseInt(input.dataset.stageClosing,10),{closing:input.checked})));
    app.querySelectorAll("[data-stage-move]").forEach(btn=>btn.addEventListener("click",()=>{const[id,dir]=btn.dataset.stageMove.split(":");moveStage(parseInt(id,10),parseInt(dir,10));}));
    app.querySelectorAll("[data-stage-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteStage(parseInt(btn.dataset.stageDelete,10))));
    const addStageBtn=document.getElementById("addStageBtn"); if(addStageBtn)addStageBtn.addEventListener("click",addStage);
    const configBlockOk=document.getElementById("configBlockOk"); if(configBlockOk)configBlockOk.addEventListener("click",dismissConfigBlock);
    const configBlockOverlay=document.getElementById("configBlockOverlay"); if(configBlockOverlay)configBlockOverlay.addEventListener("click",e=>{if(e.target===configBlockOverlay)dismissConfigBlock();});
    const stagnantHeader=document.getElementById("stagnantHeader"); if(stagnantHeader)stagnantHeader.addEventListener("click",()=>{state.stagnantCollapsed=!state.stagnantCollapsed;render();});
    const showClosedToggle=document.getElementById("showClosedToggle"); if(showClosedToggle)showClosedToggle.addEventListener("click",()=>{state.showClosed=!state.showClosed;saveShowClosed(state.showClosed);render();});
    app.querySelectorAll("[data-filter]").forEach(btn=>btn.addEventListener("click",()=>{const f=btn.dataset.filter;update({filter:state.filter===f&&f!=="all"?"all":f});}));
    app.querySelectorAll("[data-sol-filter]").forEach(btn=>btn.addEventListener("click",()=>{const f=btn.dataset.solFilter;update({solutionFilter:state.solutionFilter===f?"all":f});}));
    app.querySelectorAll("[data-stage-filter]").forEach(btn=>btn.addEventListener("click",()=>{const f=parseInt(btn.dataset.stageFilter,10);update({stageFilter:state.stageFilter===f?"all":f});}));
    app.querySelectorAll("[data-stage]").forEach(sel=>sel.addEventListener("change",()=>setStage(sel.dataset.stage,sel.value)));
    app.querySelectorAll("[data-manager]").forEach(sel=>sel.addEventListener("change",()=>setManager(sel.dataset.manager,sel.value)));
    app.querySelectorAll("[data-edit-rank]").forEach(el=>el.addEventListener("click",()=>{const id=el.dataset.editRank;const acct=state.accounts.find(a=>a.id===id);if(!acct||!acct.status)return;state.editingRankId=id;render();}));
    app.querySelectorAll("[data-rank-input]").forEach(input=>{const commit=()=>{const id=input.dataset.rankInput;const val=input.value.trim();state.editingRankId=null;if(val===""){render();return;}setPriority(id,val);};input.addEventListener("blur",commit);input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();if(e.key==="Escape"){state.editingRankId=null;render();}});input.focus();input.select();});
    app.querySelectorAll("[data-sort]").forEach(btn=>btn.addEventListener("click",()=>update({sortBy:btn.dataset.sort})));
    const addBtn=document.getElementById("addBtn"); if(addBtn)addBtn.addEventListener("click",addAccount);
    const resetBtn=document.getElementById("resetBtn"); if(resetBtn)resetBtn.addEventListener("click",resetBoard);
    app.querySelectorAll("[data-edit-name]").forEach(el=>el.addEventListener("click",()=>{state.editingId=el.dataset.editName;render();const input=app.querySelector(`[data-name-input="${el.dataset.editName}"]`);if(input){input.focus();input.select();}}));
    app.querySelectorAll("[data-stagnant-reset]").forEach(btn=>btn.addEventListener("click",e=>{e.stopPropagation();const id=btn.dataset.stagnantReset;const acct=state.accounts.find(a=>a.id===id);if(!acct)return;touch(acct);update({});}));
    app.querySelectorAll("[data-name-input]").forEach(input=>{const id=input.dataset.nameInput;input.addEventListener("blur",()=>setName(id,input.value));input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-light]").forEach(btn=>btn.addEventListener("click",()=>{const[id,statusId]=btn.dataset.light.split(":");setStatus(id,statusId);}));
    app.querySelectorAll("[data-sol]").forEach(el=>el.addEventListener("click",()=>{const[id,solId]=el.dataset.sol.split(":");toggleSolution(id,solId);}));
    app.querySelectorAll("[data-note]").forEach(input=>{input.addEventListener("blur",()=>{const id=input.dataset.note;const acct=state.accounts.find(a=>a.id===id);if(!acct)return;const newFirstLine=input.value;const existingLines=(acct.note||"").split("\n");existingLines[0]=newFirstLine;setNote(id,existingLines.join("\n").replace(/\n+$/,""));});input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});});
    app.querySelectorAll("[data-delete]").forEach(btn=>btn.addEventListener("click",()=>deleteAccount(btn.dataset.delete)));
    app.querySelectorAll("[data-details]").forEach(btn=>btn.addEventListener("click",()=>openDetailPanel(btn.dataset.details)));
    const panelClose=document.getElementById("panelCloseBtn"); if(panelClose)panelClose.addEventListener("click",closeDetailPanel);
    const panelBackdrop=document.getElementById("panelBackdrop"); if(panelBackdrop)panelBackdrop.addEventListener("click",closeDetailPanel);
    const panelNote=document.getElementById("panelNote"); if(panelNote&&state.detailPanelId)panelNote.addEventListener("blur",()=>{setNote(state.detailPanelId,panelNote.value);render();});
    const panelActionDate=document.getElementById("panelActionDate"); if(panelActionDate&&state.detailPanelId)panelActionDate.addEventListener("change",()=>setNextActionDate(state.detailPanelId,panelActionDate.value));
    const panelActionLabel=document.getElementById("panelActionLabel"); if(panelActionLabel&&state.detailPanelId){panelActionLabel.addEventListener("blur",()=>{setNextActionLabel(state.detailPanelId,panelActionLabel.value);render();});panelActionLabel.addEventListener("keydown",e=>{if(e.key==="Enter")panelActionLabel.blur();});}
    const panelActionClear=document.getElementById("panelActionClear"); if(panelActionClear&&state.detailPanelId)panelActionClear.addEventListener("click",()=>clearNextAction(state.detailPanelId));
    if(state.editingId){const input=app.querySelector(`[data-name-input="${state.editingId}"]`);if(input){input.focus();input.select();}}
  }

  document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(state.logoPopup){closeLogoPopup();return;}if(state.showSettings){saveThresholdsFromInputs();state.showSettings=false;render();return;}if(state.detailPanelId){closeDetailPanel();return;}});

  render();
  initialLoad();
</script>
</body>
</html>
